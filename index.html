function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

let lastNavKey = null;

function setState(patch, opts={}){
  state = { ...state, ...patch };
  const navKey = `${state.screen}|${state.activeTab}|${state.modal}`;
  if(opts.fromPopstate){
    lastNavKey = navKey;
  } else if(navKey !== lastNavKey){
    history.pushState({ screen: state.screen, activeTab: state.activeTab, modal: state.modal }, '');
    lastNavKey = navKey;
  }
  render();
}

window.addEventListener('popstate', (e) => {
  const target = e.state;
  if(!target){
    const fallback = state.currentUser
      ? { screen:'app', activeTab: state.activeTab || 'today', modal:null }
      : { screen:'authChoice', modal:null };
    history.replaceState(fallback, '');
    setState(fallback, { fromPopstate:true });
    return;
  }
  if(state.currentUser && AUTH_ONLY_SCREENS.includes(target.screen)){
    const fixed = { screen:'app', activeTab: state.activeTab || 'today', modal:null };
    history.replaceState(fixed, '');
    setState(fixed, { fromPopstate:true });
    return;
  }
  setState({
    screen: target.screen,
    activeTab: target.activeTab || state.activeTab,
    modal: target.modal || null,
  }, { fromPopstate:true });
});

function genId(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function initials(name){ return (name||'?').trim()[0]?.toUpperCase() || '?'; }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function timeAgo(ts){
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000);
  if(m < 1) return 'Just now';
  if(m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if(h < 24) return `${h}h ago`;
  return new Date(ts).toLocaleDateString();
}
function timeShort(ts){
  return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}
function friendlyError(error){
  return error?.message || 'Something went wrong. Please try again.';
}

/* ============================================================ */
/* Session restore — self-healing: a broken/expired local session  */
/* used to silently 401 every authenticated call forever. Now we   */
/* validate it against the server on load and wipe it if invalid.  */
/* ============================================================ */
async function restoreSession(){
  try{
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){ showAuthChoice(); return; }

    const { data: { user }, error } = await supabase.auth.getUser();
    if(error || !user){
      console.warn('Stale session detected, clearing it.', error);
      await supabase.auth.signOut({ scope: 'local' });
      showAuthChoice();
      return;
    }

    await loadAppData();
  }catch(err){
    console.error('Session check failed, clearing local session.', err);
    try{ await supabase.auth.signOut({ scope: 'local' }); }catch(_){}
    showAuthChoice();
  }
}

function showAuthChoice(){

async function getCoupleAndPartner(){
  const me = state.currentUser.id;
  const { data: couple, error } = await supabase
    .from('couples').select('id, user1_id, user2_id')
    .or(`user1_id.eq.${me},user2_id.eq.${me}`)
    .maybeSingle();
  if(error || !couple) return { couple:null, partner:null };
  const partnerId = couple.user1_id === me ? couple.user2_id : couple.user1_id;
  const { data: partner, error: pErr } = await supabase
    .from('profiles').select('*').eq('id', partnerId).single();
  if(pErr) return { couple, partner:null };
  return { couple, partner };
}

async function loadUserData(){
  const me = state.currentUser;
  if(!me) return;

  const [goals, { couple, partner }] = await Promise.all([
    getMyGoals(),
    getCoupleAndPartner(),
  ]);

  let partnerGoals = [];
  if(partner) partnerGoals = await getPartnerGoals(partner.id);

  const updates = await getUpdatesFeed(me, partner);
  const messages = couple ? await loadMessages(couple.id) : [];

  setState({ goals, partnerUser: partner, partnerGoals, updates, coupleId: couple ? couple.id : null, messages });

  if(couple) subscribeToChat(couple.id); else unsubscribeChat();
}

let chatChannel = null;
let subscribedCoupleId = null;
let lastRenderedMessageCount = 0;
let typingHideTimer = null;

async function loadMessages(coupleId){
  const { data, error } = await supabase
    .from('messages').select('*')
    .eq('couple_id', coupleId)
    .order('created_at', { ascending:true })
    .limit(300);
  if(error){ console.error(error); return []; }
  return data;
}

function subscribeToChat(coupleId){
  if(subscribedCoupleId === coupleId && chatChannel) return;
  unsubscribeChat();

  chatChannel = supabase
    .channel(`couple-${coupleId}`)
       .on('postgres_changes',
      { event:'INSERT', schema:'public', table:'messages', filter:`couple_id=eq.${coupleId}` },
      (payload) => {
        if(payload.new.sender_id === state.currentUser.id) return;
        state.messages = [...state.messages, payload.new];
        state.partnerTyping = false;
        if(state.screen==='app' && state.activeTab==='chat'){
          refreshChatList();
          updateTypingStatusUI();
        }
      }
    )
    .on('broadcast', { event:'typing' }, (payload) => {
      if(payload.payload?.userId === state.currentUser.id) return;
      state.partnerTyping = true;
      updateTypingStatusUI();
      clearTimeout(typingHideTimer);
      typingHideTimer = setTimeout(() => {
        state.partnerTyping = false;
        updateTypingStatusUI();
      }, 2500);
    })
    .subscribe();

  subscribedCoupleId = coupleId;
}

function unsubscribeChat(){
  if(chatChannel){ supabase.removeChannel(chatChannel); chatChannel = null; }
  subscribedCoupleId = null;
}

let typingSentAt = 0;
function notifyTyping(){
  if(!chatChannel) return;
  const now = Date.now();
  if(now - typingSentAt < 1500) return;
  typingSentAt = now;
  chatChannel.send({ type:'broadcast', event:'typing', payload:{ userId: state.currentUser.id } });
}

function messagesHtml(){

}

async function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const body = (input?.value || '').trim();

  if(!body || !state.coupleId || !state.partnerUser) return;

  const optimisticId = genId();

  const optimistic = {
    id: optimisticId,
    couple_id: state.coupleId,
    sender_id: state.currentUser.id,
    body,
    created_at: new Date().toISOString(),
  };

  state.messages = [...state.messages, optimistic];
  refreshChatList();

  if(input){
    input.value = '';
    input.style.height = 'auto';
    input.focus({ preventScroll: true });
  }

  /*
   * 1. Save the message
   */
  const { data, error } = await supabase
    .from('messages')
    .insert({
      couple_id: state.coupleId,
      sender_id: state.currentUser.id,
      body
    })
    .select()
    .single();

  if(error){
    console.error('Message send failed:', error);
    return;
  }

  /*
   * Replace optimistic message with
   * the real database message.
   */
  state.messages = state.messages.map(m =>
    m.id === optimisticId ? data : m
  );

  refreshChatList();

  /*
   * 2. Send push notification to partner
   */
  try{

    const { data: pushResult, error: pushError } =
      await supabase.functions.invoke('push-notifications', {
        body: {
          recipient_id: state.partnerUser.id,

          type: 'message',

          actor_id: state.currentUser.id,

          actor_name: state.currentUser.name,

          message: body,

          title: `New message from ${state.currentUser.name}`,

          body: body,

          url: '/?tab=chat'
        }
      });

    if(pushError){
      console.error(
        'Push notification failed:',
        pushError
      );
    }else{
      console.log(
        'Chat notification result:',
        pushResult
      );
    }

  }catch(pushError){

    console.error(
      'Could not trigger push notification:',
      pushError
    );

  }
}

async function createAccount(){
  const name = state.authName.trim();
  const password = state.authPassword;

  if(!name){ setState({ authError:'Enter your name.' }); return; }
  if(!password || password.length < 6){ setState({ authError:'Password must be at least 6 characters.' }); return; }

  setState({ busy:true, authError:'' });
  const internalEmail = makeInternalEmail(name);
  const { data, error } = await supabase.auth.signUp({
    email: internalEmail, password, options: { data: { name } },
  });
  if(error){ setState({ busy:false, authError: friendlyError(error) }); return; }

  if(!data.session){
    setState({
      busy:false,
      authError:'Signup needs "Confirm email" turned OFF in your Supabase project (Authentication → Settings → Email).',
      screen:'authChoice',
    });
    return;
  }

  const { data: profile, error: profileError } = await supabase
    .from('profiles').select('*').eq('id', data.user.id).single();
  if(profileError){ setState({ busy:false, authError: friendlyError(profileError) }); return; }

  setState({ busy:false, currentUser: profile, screen:'yourCode' });
}

async function loginWithCode(){
  const code = state.authCodeInput.trim().toUpperCase();
  const password = state.authPassword;
  if(!code){ setState({ authError:'Enter your code.' }); return; }
  if(!password){ setState({ authError:'Enter your password.' }); return; }

  setState({ busy:true, authError:'' });
  const { data: email, error } = await supabase.rpc('get_email_for_code', { p_code: code });
  if(error || !email){ setState({ busy:false, authError:'No account found with that code.' }); return; }

  const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
  if(signInError){ setState({ busy:false, authError: friendlyError(signInError) }); return; }

  setState({ busy:false });
  await loadAppData();
}

function pushIsSupported(){
  return (
    'serviceWorker' in navigator &&
    'PushManager' in window &&
    'Notification' in window
  );
}


/*
 * Get the active service worker.
 */
async function getPushRegistration(){
  if(!('serviceWorker' in navigator)){
    throw new Error('Service workers are not supported.');
  }

  return await navigator.serviceWorker.ready;
}


/*
 * Check the REAL notification state.
 *
 * IMPORTANT:
 * Notification.permission is controlled by iOS/browser.
 * CoupleFlow cannot turn the iPhone Settings switch off.
 */
async function checkPushSubscriptionStatus(){

  if(!pushIsSupported()){
    state.pushSubscribed = false;
    return;
  }

  try{

    const permission = Notification.permission;

    const registration =
      await getPushRegistration();

    const subscription =
      await registration.pushManager.getSubscription();

    /*
     * CoupleFlow = ON only when BOTH exist:
     *
     * permission = granted
     * subscription = exists
     */
    state.pushSubscribed =
      permission === 'granted' &&
      !!subscription;

  }catch(error){

    console.warn(
      'Push status check failed:',
      error
    );

    state.pushSubscribed = false;
  }
}


/*
 * Save/update the current subscription in Supabase.
 *
 * Endpoint identifies the specific device/browser subscription.
 */
async function savePushSubscription(subscription){

  if(!state.currentUser){
    throw new Error('You must be logged in first.');
  }

  const subJson = subscription.toJSON();

  if(!subJson?.endpoint){
    throw new Error(
      'Push subscription does not contain an endpoint.'
    );
  }

  const {
    error
  } = await supabase
    .from('push_subscriptions')
    .upsert(
      {
        user_id: state.currentUser.id,
        endpoint: subJson.endpoint,
        subscription: subJson,
        updated_at: new Date().toISOString()
      },
      {
        onConflict: 'endpoint'
      }
    );

  if(error){
    throw error;
  }

  console.log(
    'CoupleFlow push subscription synchronized.'
  );
}


/*
 * Synchronize an already-existing subscription.
 *
 * IMPORTANT:
 * This DOES NOT request notification permission.
 *
 * It is safe to run when CoupleFlow starts.
 */
async function syncExistingPushSubscription(){

  if(!pushIsSupported()){
    state.pushSubscribed = false;
    return false;
  }

  if(!state.currentUser){
    state.pushSubscribed = false;
    return false;
  }

  try{

    /*
     * iPhone/browser has not granted permission.
     */
    if(Notification.permission !== 'granted'){

      state.pushSubscribed = false;

      return false;
    }

    const registration =
      await getPushRegistration();

    const subscription =
      await registration.pushManager.getSubscription();

    /*
     * Permission is granted but there is no
     * active PushSubscription.
     *
     * Do NOT automatically request permission.
     * The user can press Enable Notifications.
     */
    if(!subscription){

      state.pushSubscribed = false;

      return false;
    }

    await savePushSubscription(subscription);

    state.pushSubscribed = true;

    return true;

  }catch(error){

    console.error(
      'Push synchronization failed:',
      error
    );

    state.pushSubscribed = false;

    return false;
  }
}


/*
 * ENABLE NOTIFICATIONS
 *
 * This must be triggered by the user's button tap.
 * This is especially important for iPhone Web Push.
 */
async function enablePushNotifications(){

  if(!state.currentUser){

    alert('Please log in first.');

    return;
  }

  if(!pushIsSupported()){

    alert(
      "Push notifications aren't supported on this browser/device."
    );

    return;
  }

  if(!window.isSecureContext){

    alert(
      'Notifications require a secure HTTPS connection.'
    );

    return;
  }

  try{

    /*
     * Ask the operating system/browser for permission.
     *
     * If permission was already granted,
     * this simply returns "granted".
     */
    const permission =
      await Notification.requestPermission();

    if(permission !== 'granted'){

      state.pushSubscribed = false;

      render();

      alert(
        'Notifications were not allowed. ' +
        'On iPhone, enable CoupleFlow notifications in ' +
        'Settings → Notifications → CoupleFlow.'
      );

      return;
    }

    /*
     * Get active service worker.
     */
    const registration =
      await getPushRegistration();

    /*
     * Reuse an existing subscription if possible.
     */
    let subscription =
      await registration.pushManager.getSubscription();

    /*
     * No subscription exists.
     *
     * Create a new one.
     */
    if(!subscription){

      subscription =
        await registration.pushManager.subscribe({

          userVisibleOnly: true,

          applicationServerKey:
            urlBase64ToUint8Array(
              VAPID_PUBLIC_KEY
            )
        });
    }

    /*
     * Save/update the current subscription.
     */
    await savePushSubscription(subscription);

    state.pushSubscribed = true;

    render();

    console.log(
      'CoupleFlow notifications enabled.'
    );

  }catch(error){

    console.error(
      'Push subscribe failed:',
      error
    );

    state.pushSubscribed = false;

    render();

    alert(
      'Something went wrong turning on notifications: ' +
      (error?.message || 'Unknown error')
    );
  }
}


/*
 * DISABLE NOTIFICATIONS INSIDE COUPLEFLOW
 *
 * IMPORTANT:
 *
 * This removes CoupleFlow's push subscription.
 *
 * It DOES NOT and CANNOT change:
 *
 * iPhone Settings
 * → Notifications
 * → CoupleFlow
 * → Allow Notifications
 *
 * That system setting is controlled by iOS.
 */
async function disablePushNotifications(){

  if(!state.currentUser){

    return;
  }

  if(!pushIsSupported()){

    state.pushSubscribed = false;

    render();

    return;
  }

  try{

    const registration =
      await getPushRegistration();

    const subscription =
      await registration.pushManager.getSubscription();

    if(subscription){

      const endpoint =
        subscription.endpoint;

      /*
       * Remove the subscription from Supabase.
       *
       * IMPORTANT:
       * Match both user_id AND endpoint so one user's
       * device cannot accidentally delete another user's row.
       */
      const {
        error: deleteError
      } = await supabase
        .from('push_subscriptions')
        .delete()
        .eq('user_id', state.currentUser.id)
        .eq('endpoint', endpoint);

      if(deleteError){

        console.warn(
          'Could not remove push subscription from database:',
          deleteError
        );
      }

      /*
       * Unsubscribe this browser/PWA subscription.
       */
      try{

        await subscription.unsubscribe();

      }catch(unsubscribeError){

        console.warn(
          'Browser push unsubscribe warning:',
          unsubscribeError
        );
      }
    }

    state.pushSubscribed = false;

    render();

    console.log(
      'CoupleFlow push notifications disabled.'
    );

  }catch(error){

    console.error(
      'Push unsubscribe failed:',
      error
    );

    state.pushSubscribed = false;

    render();
  }
}

async function addGoal(data){
  const { data: goal, error } = await supabase.from('goals').insert({
    user_id: state.currentUser.id,
    title: data.title,
    category: data.category,
    priority: data.priority,
    duration: data.duration || null,
    is_private: !!data.private,
  }).select().single();

  if(error){ alert(friendlyError(error)); return; }
  setState({ goals: [goal, ...state.goals], modal:null });
}

async function toggleGoal(id){
  const goal = state.goals.find(g => g.id === id);
  if(!goal) return;
  const nextDone = !goal.is_done;

  setState({ goals: state.goals.map(g => g.id===id ? { ...g, is_done: nextDone } : g) });

  const { error } = await supabase.from('goals')
    .update({ is_done: nextDone, completed_at: nextDone ? new Date().toISOString() : null })
    .eq('id', id);

  if(error){
    console.error(error);
    alert(friendlyError(error));
    setState({ goals: state.goals.map(g => g.id===id ? { ...g, is_done: !nextDone } : g) });
  }
}

async function deleteGoal(id){
  const prev = state.goals;
  setState({ goals: state.goals.filter(g => g.id !== id) });
  const { error } = await supabase.from('goals').delete().eq('id', id);
  if(error){ console.error(error); setState({ goals: prev }); }
}

/* ============================================================ */
/* Updates + photo upload                                         */
/* ============================================================ */
async function postUpdate(caption, file){
  if(!caption.trim() && !file) return;

  const { data: update, error } = await supabase
    .from('updates')
    .insert({
      user_id: state.currentUser.id,
      caption: caption.trim() || null,
    })
    .select()
    .single();

  if(error){
    console.error(error);
    alert(friendlyError(error));
    return;
  }

  if(file){

    // Make the filename safe for Supabase Storage
    const safeName = file.name
      .normalize('NFKD')
      .replace(/[^\w.-]+/g, '_')
      .replace(/_+/g, '_')
      .replace(/^_+|_+$/g, '')
      .slice(0, 120);

    const fileName = `${Date.now()}-${safeName || 'photo.jpg'}`;

    const path =
      `${state.currentUser.id}/updates/${update.id}/${fileName}`;

    console.log('Uploading photo:', path);

    const { error: uploadError } = await supabase
      .storage
      .from('photos')
      .upload(path, file, {
        cacheControl: '3600',
        upsert: false,
        contentType: file.type || 'image/jpeg'
      });

    if(uploadError){
      console.error('PHOTO UPLOAD ERROR:', uploadError);
      alert('Could not upload the photo. Please try again.');
      return;
    }

    const { error: photoDbError } = await supabase
      .from('update_photos')
      .insert({
        update_id: update.id,
        storage_path: path
      });

    if(photoDbError){
      console.error('PHOTO DATABASE ERROR:', photoDbError);
      return;
    }
  }

  setState({
    modal: null,
    pendingPhotoFile: null
  });

  await loadUserData();
}

            const p = v.total ? Math.round((v.done/v.total)*100) : 0;
            return `
              <div class="glass" style="padding:14px; margin-bottom:8px; display:flex; align-items:center; gap:12px;">
                <div class="icon-badge done">${CATEGORY_EMOJI[cat]}</div>
                <div style="flex:1;">
                  <div style="font-size:13px; font-weight:600; margin-bottom:4px;">${CATEGORY_LABEL[cat]||cat}</div>
                  <div style="width:100%; height:5px; border-radius:999px; background:var(--glass-border);">
                    <div style="width:${p}%; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--purple),var(--pink));"></div>
                  </div>
                </div>
                <div class="muted" style="font-size:12px; font-weight:700;">${v.done}/${v.total}</div>
              </div>`;
          }).join('')}
    </div>`;
}

/* ============================================================ */
/* Render: Together                                               */
/* ============================================================ */
function renderTogether(){
  const goals = state.goals, pGoals = state.partnerGoals;
  const myPct = goals.length ? Math.round((goals.filter(g=>g.is_done).length/goals.length)*100) : 0;
  const pPct = pGoals.length ? Math.round((pGoals.filter(g=>g.is_done).length/pGoals.length)*100) : 0;
  const together = state.partnerUser ? Math.round((myPct+pPct)/2) : myPct;

  return `
    <div style="padding:18px 18px 30px;">
      <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">🫶 Together</h1>
      <p class="muted" style="font-size:13px; margin-bottom:16px;">${state.partnerUser ? 'You and '+escapeHtml(state.partnerUser.name) : 'Connect with your partner to see this fill in'}</p>

      <div class="glass glass-strong" style="padding:22px; margin-bottom:16px;">
        <div style="display:flex; justify-content:space-around; margin-bottom:16px;">
          <div style="text-align:center;">
            <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px; color:var(--purple-deep);">${myPct}%</div>
            <div class="muted" style="font-size:11px; margin-top:2px;">You</div>
          </div>
          <div style="text-align:center;">
            <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px;">${together}%</div>
            <div class="muted" style="font-size:11px; margin-top:2px;">Together</div>
          </div>
          <div style="text-align:center;">
            <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px; color:var(--pink-deep);">${pPct}%</div>
            <div class="muted" style="font-size:11px; margin-top:2px;">${state.partnerUser ? escapeHtml(state.partnerUser.name) : 'Partner'}</div>
          </div>
        </div>
        <div style="text-align:center; font-size:13.5px; font-weight:500; padding:12px 8px; border-radius:16px; background:linear-gradient(135deg,color-mix(in srgb, var(--purple) 12%, transparent),color-mix(in srgb, var(--pink) 12%, transparent));">
          ${!state.partnerUser ? 'Connect to start building your week together ✨' : together>=70 ? 'You both had a great week ✨' : 'Every bit of progress counts 🌱'}
        </div>
      </div>

      ${!state.partnerUser ? `<button class="btn-primary" data-action="open-connect">Connect with your partner</button>` : ''}
    </div>`;
}

/* ============================================================ */
/* Render: Modals                                                 */
/* ============================================================ */

function renderModal(){
  if(!state.modal) return '';

  /* =========================
     ADD CHOICE
     ========================= */
  if(state.modal === 'addChoice') return `
    <div class="modal-overlay" data-action="close-modal">
      <div class="modal-sheet">

        <div class="drag-handle"></div>

        <h2 style="
          font-size:17px;
          font-weight:700;
          margin:0 0 16px;
        ">
          ＋ What would you like to do?
        </h2>

        <button
          type="button"
          class="btn-secondary"
          style="
            width:100%;
            margin-bottom:10px;
            text-align:left;
            padding:14px 16px;
          "
          data-action="open-add-goal"
        >
          🎯 &nbsp; Add a goal
        </button>

        <button
          type="button"
          class="btn-secondary"
          style="
            width:100%;
            text-align:left;
            padding:14px 16px;
          "
          data-action="open-add-update"
        >
          📸 &nbsp; Share a moment
        </button>

      </div>
    </div>
  `;


  /* =========================
     ADD GOAL
     ========================= */
  if(state.modal === 'addGoal') return `
    <div class="modal-overlay" data-action="close-modal">
      <div class="modal-sheet">

        <div style="
          display:flex;
          align-items:center;
          gap:10px;
          margin:2px 0 20px;
        ">

          <button
            type="button"
            class="round-btn"
            style="
              width:36px;
              height:36px;
              flex-shrink:0;
              font-size:18px;
            "
            data-action="back-add-choice"
            aria-label="Back"
          >
            ←
          </button>

          <h2 style="
            font-size:17px;
            font-weight:700;
            margin:0;
          ">
            🎯 Add a goal
          </h2>

        </div>

        <input
          id="goal-title"
          class="input"
          placeholder="What do you want to accomplish?"
          maxlength="60"
        />

        <select id="goal-category" class="input">
          ${Object.keys(CATEGORY_EMOJI).map(c => `
            <option value="${c}">
              ${CATEGORY_EMOJI[c]} ${CATEGORY_LABEL[c]}
            </option>
          `).join('')}
        </select>

        <input
          id="goal-duration"
          class="input"
          placeholder="Estimated time (e.g. 30m)"
          maxlength="16"
        />

        <select id="goal-priority" class="input">
          <option value="medium">Medium priority</option>
          <option value="high">High priority</option>
          <option value="low">Low priority</option>
        </select>

        <label style="
          display:flex;
          align-items:center;
          gap:8px;
          font-size:13px;
          margin:4px 0 18px;
          cursor:pointer;
        ">
          <input type="checkbox" id="goal-private">
          🔒 Keep this private from my partner
        </label>

        <button
          type="button"
          class="btn-primary"
          style="
            width:100%;
            display:block;
            margin-top:6px;
            margin-bottom:4px;
            padding:13px 16px;
          "
          data-action="submit-goal"
        >
          🎯 Add goal
        </button>

      </div>
    </div>
  `;


  /* =========================
     SHARE A MOMENT
     ========================= */
  if(state.modal === 'addUpdate') return `
    <div class="modal-overlay" data-action="close-modal">
      <div class="modal-sheet">

        <div style="
          display:flex;
          align-items:center;
          gap:10px;
          margin:2px 0 20px;
        ">

          <button
            type="button"
            class="round-btn"
            style="
              width:36px;
              height:36px;
              flex-shrink:0;
              font-size:18px;
            "
            data-action="back-add-choice"
            aria-label="Back"
          >
            ←
          </button>

          <h2 style="
            font-size:17px;
            font-weight:700;
            margin:0;
          ">
            📸 Share a moment
          </h2>

        </div>

        <label
          class="photo-placeholder"
          for="update-photo-input"
          style="cursor:pointer;"
        >
          ${state.pendingPhotoFile ? '✅' : '🖼️'}

          <span class="photo-note" style="margin:0;">
            ${
              state.pendingPhotoFile
                ? escapeHtml(state.pendingPhotoFile.name)
                : 'Tap to choose a photo'
            }
          </span>
        </label>

        <input
          type="file"
          id="update-photo-input"
          accept="image/*"
          style="display:none;"
        />

        <textarea
          id="update-caption"
          class="input"
          rows="3"
          placeholder="Say something about this moment..."
          style="resize:none;"
        ></textarea>

        <button
          type="button"
          class="btn-primary"
          style="
            width:100%;
            margin-top:8px;
            padding:13px 16px;
          "
          data-action="submit-update"
        >
          📸 Share this moment
        </button>

      </div>
    </div>
  `;


  return '';
}

/* ============================================================ */
/* Master render                                                  */
/* ============================================================ */
function render(){
  const root = document.getElementById('screen');
  document.getElementById('app').setAttribute('data-theme', state.theme);
  document.documentElement.setAttribute('data-theme', state.theme);

  let body = '';
  if(state.screen==='loading') body = renderLoading();
  else if(state.screen==='authChoice') body = renderAuthChoice();
  else if(state.screen==='create') body = renderCreateForm();
  else if(state.screen==='login') body = renderLoginForm();
  else if(state.screen==='yourCode') body = renderYourCode();
  else if(state.screen==='app'){
    const screens = { today:renderToday, goals:renderGoals, chat:renderChat, updates:renderUpdates, progress:renderProgress, together:renderTogether };
    body = (screens[state.activeTab]||renderToday)();
  }

   const withTopbar = ['app'].includes(state.screen);
  root.innerHTML = `
    ${withTopbar ? renderTopbar() : ''}
    ${body}
    ${state.screen==='app' ? renderBottomNav() : ''}
    ${renderModal()}
  `;

  document.getElementById('app').classList.toggle(
    'chat-mode', state.screen==='app' && state.activeTab==='chat'
  );

  bindInputs();

  if(state.screen==='app' && state.activeTab==='chat'){
    const list = document.getElementById('chat-list');
    if(list && state.messages.length !== lastRenderedMessageCount){
      list.scrollTop = list.scrollHeight;
      lastRenderedMessageCount = state.messages.length;
    }
    const chatInput = document.getElementById('chat-input');
    if(chatInput){
      chatInput.addEventListener('input', () => {
        notifyTyping();
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 90) + 'px';
      });
      chatInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault();
          sendChatMessage();
        }
      });
    }
  }
}

/* ============================================================ */
/* Input bindings                                                 */
/* ============================================================ */
function bindInputs(){
  const nameInput = document.getElementById('name-input');
  if(nameInput) nameInput.addEventListener('input', e => state.authName = e.target.value);

  const passwordInput = document.getElementById('password-input');
  if(passwordInput) passwordInput.addEventListener('input', e => state.authPassword = e.target.value);

  const loginCodeInput = document.getElementById('login-code-input');
  if(loginCodeInput) loginCodeInput.addEventListener('input', e => state.authCodeInput = e.target.value);

  const connectNow = document.getElementById('connect-now-input');
  if(connectNow) connectNow.addEventListener('input', e => state.connectInput = e.target.value);

  const photoInput = document.getElementById('update-photo-input');
  if(photoInput) photoInput.addEventListener('change', e => {
    state.pendingPhotoFile = e.target.files[0] || null;
    render();
  });
}

/* ============================================================ */
/* Event delegation                                               */
/* ============================================================ */
document.addEventListener('click', async (e) => {

  const el = e.target.closest('[data-action]');
  if(!el) return;

  const action = el.getAttribute('data-action');

  /* =========================
     MODAL BACKDROP
     ========================= */
  if(action === 'close-modal') {
    if(e.target !== el) return;
    history.back();
    return;
  }


  /* =========================
     GENERAL ACTIONS
     ========================= */

  if(action === 'toggle-theme') {
    setState({
      theme: state.theme === 'dark' ? 'light' : 'dark'
    });
    return;
  }

  if(action === 'goto-create') {
    setState({
      screen:'create',
      authError:''
    });
    return;
  }

  if(action === 'goto-login') {
    setState({
      screen:'login',
      authError:''
    });
    return;
  }

  if(action === 'goto-choice') {
    setState({
      screen:'authChoice',
      authError:''
    });
    return;
  }

  if(action === 'submit-create') {
    createAccount();
    return;
  }

  if(action === 'submit-login') {
    loginWithCode();
    return;
  }


  /* =========================
     ADD MENU
     ========================= */

  if(action === 'open-add') {
    setState({
      modal:'addChoice'
    });
    return;
  }

  if(action === 'open-add-goal') {
    setState({
      modal:'addGoal'
    });
    return;
  }

  if(action === 'open-add-update') {
    setState({
      modal:'addUpdate',
      pendingPhotoFile:null
    });
    return;
  }

  if(action === 'back-add-choice') {
    setState({
      modal:'addChoice'
    });
    return;
  }


  /* =========================
     TABS
     ========================= */

  if(action === 'tab') {
    setState({
      activeTab: el.getAttribute('data-tab')
    });
    return;
  }


  /* =========================
     SETTINGS / CONNECTION
     ========================= */

  if(action === 'open-connect' ||
     action === 'open-connect-from-settings') {

    setState({
      modal:'connect',
      connectError:''
    });

    return;
  }

  if(action === 'open-settings') {

    await checkPushSubscriptionStatus();

    setState({
      modal:'settings'
    });

    return;
  }

  if(action === 'enable-notifications') {
    enablePushNotifications();
    return;
  }

  if(action === 'disable-notifications') {
    disablePushNotifications();
    return;
  }


  /* =========================
     OTHER ACTIONS
     ========================= */

  if(action === 'do-logout') {
    logout();
    return;
  }

  if(action === 'disconnect-partner') {
    disconnectPartner();
    return;
  }

  if(action === 'filter-goals') {
    goalsFilter = el.getAttribute('data-filter');
    render();
    return;
  }

  if(action === 'toggle-goal') {
    toggleGoal(el.getAttribute('data-id'));
    return;
  }

  if(action === 'delete-goal') {
    deleteGoal(el.getAttribute('data-id'));
    return;
  }

  if(action === 'react') {
    addReaction(
      el.getAttribute('data-update-id'),
      el.getAttribute('data-emoji')
    );
    return;
  }

  if(action === 'send-chat') {
    sendChatMessage();
    return;
  }


  /* =========================
     CONNECT
     ========================= */

  if(action === 'connect-now') {
    await connectPartner(state.connectInput);

    if(!state.connectError) {
      finishOnboarding();
    }

    return;
  }

  if(action === 'submit-connect') {

    const val =
      document.getElementById('connect-input')?.value || '';

    connectPartner(val);

    return;
  }


  /* =========================
     ADD GOAL
     ========================= */

  if(action === 'submit-goal') {

    const title =
      document.getElementById('goal-title')?.value.trim();

    if(!title) {
      document.getElementById('goal-title')?.focus();
      return;
    }

    const category =
      document.getElementById('goal-category')?.value;

    const duration =
      document.getElementById('goal-duration')?.value.trim();

    const priority =
      document.getElementById('goal-priority')?.value;

    const priv =
      document.getElementById('goal-private')?.checked || false;

    addGoal({
      title,
      category,
      duration,
      priority,
      private: priv
    });

    return;
  }


  /* =========================
     SHARE UPDATE
     ========================= */

  if(action === 'submit-update') {

    const caption =
      document.getElementById('update-caption')?.value || '';

    postUpdate(
      caption,
      state.pendingPhotoFile
    );

    return;
  }

});

/* ============================================================ */
/* Init                                                           */
/* ============================================================ */
render();
restoreSession();

})();

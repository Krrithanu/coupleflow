/* ============================================================ */
/* State                                                          */

const CATEGORY_EMOJI = { study:'📚', fitness:'🏋️', code:'💻', creative:'🎨', learning:'🧠', habit:'🌱' };
const CATEGORY_LABEL = { study:'Study', fitness:'Fitness', code:'Coding', creative:'Creative', learning:'Learning', habit:'Habit' };
const AUTH_ONLY_SCREENS = ['loading','authChoice','create','login','yourCode'];

let state = {
  theme: 'light',
  screen: 'loading',
  authName: '',
  authCodeInput: '',
  authPassword: '',
  authError: '',
  busy: false,

  currentUser: null,
  partnerUser: null,
  coupleId: null,

  activeTab: 'today',
  goals: [],
  partnerGoals: [],
  updates: [],
  messages: [],
  partnerTyping: false,

  modal: null,
  connectInput: '',
  connectError: '',
  pendingPhotoFile: null,

  notificationPermission: 'default',
  notificationStatus: 'unknown',
  notificationBusy: false,
  notificationError: '',
};

let lastNavKey = null;

function setState(patch, opts={}){
  state = { ...state, ...patch };
  const navKey = `${state.screen}|${state.activeTab}|${state.modal}`;
  if(opts.fromPopstate){
    lastNavKey = navKey;
  } else if(navKey !== lastNavKey){
    history.pushState({ screen: state.screen, activeTab: state.activeTab, modal: state.modal }, '');
    lastNavKey = navKey;
  }
  render();
}

window.addEventListener('popstate', (e) => {
  const target = e.state;
  if(!target){
    const fallback = state.currentUser
      ? { screen:'app', activeTab: state.activeTab || 'today', modal:null }
      : { screen:'authChoice', modal:null };
    history.replaceState(fallback, '');
    setState(fallback, { fromPopstate:true });
    return;
  }
  if(state.currentUser && AUTH_ONLY_SCREENS.includes(target.screen)){
    const fixed = { screen:'app', activeTab: state.activeTab || 'today', modal:null };
    history.replaceState(fixed, '');
    setState(fixed, { fromPopstate:true });
    return;
  }
  setState({
    screen: target.screen,
    activeTab: target.activeTab || state.activeTab,
    modal: target.modal || null,
  }, { fromPopstate:true });
});

/* ============================================================ */
/* Utilities                                                      */
/* ============================================================ */
function genId(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function initials(name){ return (name||'?').trim()[0]?.toUpperCase() || '?'; }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function timeAgo(ts){
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000);
  if(m < 1) return 'Just now';
  if(m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if(h < 24) return `${h}h ago`;
  return new Date(ts).toLocaleDateString();
}
function timeShort(ts){
  return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}
function friendlyError(error){
  return error?.message || 'Something went wrong. Please try again.';
}

function getInitialTab(){
  const tab = new URLSearchParams(location.search).get('tab');
  return ['today','goals','chat','updates','progress','together'].includes(tab) ? tab : 'today';
}

/* ============================================================ */
/* Web push notifications                                       */
/* ============================================================ */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}

function pushSupported(){
  return 'serviceWorker' in navigator &&
    'PushManager' in window &&
    'Notification' in window;
}

async function loadPushStatus(){
  if(!state.currentUser){
    return;
  }

  if(!pushSupported()){
    setState({ notificationPermission:'unsupported', notificationStatus:'unsupported' });
    return;
  }

  const permission = Notification.permission;
  let status = permission === 'denied' ? 'blocked' : 'off';

  try{
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.getSubscription();
    if(subscription) status = 'enabled';
  }catch(error){
    console.warn('Unable to inspect push subscription:', error);
  }

  setState({
    notificationPermission: permission,
    notificationStatus: status,
    notificationError:''
  });
}

async function enablePushNotifications(){
  if(!state.currentUser || !pushSupported()) return;

  if(!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY.startsWith('REPLACE_')){
    setState({
      notificationError:'Add your VAPID public key to index.html first.',
      notificationStatus:'off'
    });
    return;
  }

  setState({ notificationBusy:true, notificationError:'' });

  try{
    const permission = await Notification.requestPermission();

    if(permission !== 'granted'){
      setState({
        notificationBusy:false,
        notificationPermission:permission,
        notificationStatus:permission === 'denied' ? 'blocked' : 'off',
        notificationError:permission === 'denied'
          ? 'Notifications are blocked in your browser. Allow them for CoupleFlow in site settings.'
          : ''
      });
      return;
    }

    const registration = await navigator.serviceWorker.ready;
    let subscription = await registration.pushManager.getSubscription();

    if(!subscription){
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    const subscriptionJson = subscription.toJSON();

    const { error } = await supabase
      .from('push_subscriptions')
      .upsert({
        user_id: state.currentUser.id,
        endpoint: subscription.endpoint,
        subscription: subscriptionJson,
        updated_at: new Date().toISOString()
      }, { onConflict:'endpoint' });

    if(error) throw error;

    setState({
      notificationBusy:false,
      notificationPermission:'granted',
      notificationStatus:'enabled',
      notificationError:''
    });
  }catch(error){
    console.error('Push subscription failed:', error);
    setState({
      notificationBusy:false,
      notificationStatus:'off',
      notificationError:friendlyError(error)
    });
  }
}

async function disablePushNotifications(){
  if(!state.currentUser || !pushSupported()) return;

  setState({ notificationBusy:true, notificationError:'' });

  try{
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.getSubscription();

    if(subscription){
      await supabase
        .from('push_subscriptions')
        .delete()
        .eq('endpoint', subscription.endpoint)
        .eq('user_id', state.currentUser.id);

      await subscription.unsubscribe();
    }

    setState({
      notificationBusy:false,
      notificationStatus:'off',
      notificationPermission:Notification.permission,
      notificationError:''
    });
  }catch(error){
    console.error('Push unsubscribe failed:', error);
    setState({
      notificationBusy:false,
      notificationError:friendlyError(error)
    });
  }
}

/* ============================================================ */
/* Session restore — self-healing: a broken/expired local session  */
/* used to silently 401 every authenticated call forever. Now we   */
/* validate it against the server on load and wipe it if invalid.  */
/* ============================================================ */
async function restoreSession(){
  try{
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){ showAuthChoice(); return; }

    const { data: { user }, error } = await supabase.auth.getUser();
    if(error || !user){
      console.warn('Stale session detected, clearing it.', error);
      await supabase.auth.signOut({ scope: 'local' });
      showAuthChoice();
      return;
    }

    await loadAppData();
  }catch(err){
    console.error('Session check failed, clearing local session.', err);
    try{ await supabase.auth.signOut({ scope: 'local' }); }catch(_){}
    showAuthChoice();
  }
}

function showAuthChoice(){
  history.replaceState({ screen:'authChoice', modal:null }, '');
  lastNavKey = 'authChoice|today|null';
  setState({ screen: 'authChoice' }, { fromPopstate:true });
}

supabase.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_OUT'){
    unsubscribeChat();
    const fresh = {
      currentUser:null, partnerUser:null, coupleId:null, goals:[], partnerGoals:[],
      updates:[], messages:[], partnerTyping:false,
      screen:'authChoice', authName:'', authCodeInput:'', authPassword:'',
      authError:'', modal:null,
    };
    history.replaceState({ screen:'authChoice', modal:null }, '');
    setState(fresh, { fromPopstate:true });
  }
});

/* ============================================================ */
/* Data loading                                                   */
/* ============================================================ */
async function loadAppData(){
  try{
    const { data: { user } } = await supabase.auth.getUser();
    if(!user){ showAuthChoice(); return; }

    const { data: profile, error: profileError } = await supabase
      .from('profiles').select('*').eq('id', user.id).single();
    if(profileError) throw profileError;

    const initialTab = getInitialTab();
    history.replaceState({ screen:'app', activeTab:initialTab, modal:null }, '');
    lastNavKey = `app|${initialTab}|null`;
    setState({ currentUser: profile, screen: 'app', activeTab: initialTab }, { fromPopstate:true });
    await loadUserData();
    await loadPushStatus();
  }catch(err){
    console.error(err);
    try{ await supabase.auth.signOut({ scope:'local' }); }catch(_){}
    history.replaceState({ screen:'authChoice', modal:null }, '');
    setState({ screen:'authChoice', authError: friendlyError(err) }, { fromPopstate:true });
  }
}

async function getCoupleAndPartner(){
  const me = state.currentUser.id;
  const { data: couple, error } = await supabase
    .from('couples').select('id, user1_id, user2_id')
    .or(`user1_id.eq.${me},user2_id.eq.${me}`)
    .maybeSingle();
  if(error || !couple) return { couple:null, partner:null };
  const partnerId = couple.user1_id === me ? couple.user2_id : couple.user1_id;
  const { data: partner, error: pErr } = await supabase
    .from('profiles').select('*').eq('id', partnerId).single();
  if(pErr) return { couple, partner:null };
  return { couple, partner };
}

async function loadUserData(){
  const me = state.currentUser;
  if(!me) return;

  const [goals, { couple, partner }] = await Promise.all([
    getMyGoals(),
    getCoupleAndPartner(),
  ]);

  let partnerGoals = [];
  if(partner) partnerGoals = await getPartnerGoals(partner.id);

  const updates = await getUpdatesFeed(me, partner);
  const messages = couple ? await loadMessages(couple.id) : [];

  setState({ goals, partnerUser: partner, partnerGoals, updates, coupleId: couple ? couple.id : null, messages });

  if(couple) subscribeToChat(couple.id); else unsubscribeChat();
}

async function getMyGoals(){
  const { data, error } = await supabase
    .from('goals').select('*')
    .eq('user_id', state.currentUser.id)
    .order('created_at', { ascending:false });
  if(error){ console.error(error); return []; }
  return data;
}

async function getPartnerGoals(partnerId){
  const { data, error } = await supabase
    .from('goals').select('*')
    .eq('user_id', partnerId)
    .order('created_at', { ascending:false });
  if(error){ console.error(error); return []; }
  return data;
}

async function getUpdatesFeed(me, partner){
  const ids = partner ? [me.id, partner.id] : [me.id];
  const { data, error } = await supabase
    .from('updates')
    .select('*, update_photos(id, storage_path), reactions(id, emoji, user_id)')
    .in('user_id', ids)
    .order('created_at', { ascending:false })
    .limit(50);
  if(error){ console.error(error); return []; }

  const withUrls = await Promise.all(data.map(async (u) => {
    let photoUrl = null;
    if(u.update_photos && u.update_photos.length){
      const path = u.update_photos[0].storage_path;
      const { data: signed } = await supabase.storage.from('photos').createSignedUrl(path, 3600);
      photoUrl = signed?.signedUrl || null;
    }
    return {
      ...u,
      authorName: u.user_id === me.id ? me.name : (partner?.name || 'Partner'),
      mine: u.user_id === me.id,
      photoUrl,
      reactions: u.reactions || [],
    };
  }));
  return withUrls;
}

/* ============================================================ */
/* Chat                                                            */
/* ============================================================ */
let chatChannel = null;
let subscribedCoupleId = null;
let lastRenderedMessageCount = 0;
let typingHideTimer = null;

async function loadMessages(coupleId){
  const { data, error } = await supabase
    .from('messages').select('*')
    .eq('couple_id', coupleId)
    .order('created_at', { ascending:true })
    .limit(300);
  if(error){ console.error(error); return []; }
  return data;
}

function subscribeToChat(coupleId){
  if(subscribedCoupleId === coupleId && chatChannel) return;
  unsubscribeChat();

  chatChannel = supabase
    .channel(`couple-${coupleId}`)
    .on('postgres_changes',
      { event:'INSERT', schema:'public', table:'messages', filter:`couple_id=eq.${coupleId}` },
      (payload) => {
        if(payload.new.sender_id === state.currentUser.id) return;
        setState({ messages: [...state.messages, payload.new], partnerTyping:false });
      }
    )
    .on('broadcast', { event:'typing' }, (payload) => {
      if(payload.payload?.userId === state.currentUser.id) return;
      setState({ partnerTyping:true });
      clearTimeout(typingHideTimer);
      typingHideTimer = setTimeout(() => setState({ partnerTyping:false }), 2500);
    })
    .subscribe();

  subscribedCoupleId = coupleId;
}

function unsubscribeChat(){
  if(chatChannel){ supabase.removeChannel(chatChannel); chatChannel = null; }
  subscribedCoupleId = null;
}

let typingSentAt = 0;
function notifyTyping(){
  if(!chatChannel) return;
  const now = Date.now();
  if(now - typingSentAt < 1500) return;
  typingSentAt = now;
  chatChannel.send({ type:'broadcast', event:'typing', payload:{ userId: state.currentUser.id } });
}

async function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const body = (input?.value || '').trim();
  if(!body || !state.coupleId) return;

  const optimisticId = genId();
  const optimistic = {
    id: optimisticId, couple_id: state.coupleId, sender_id: state.currentUser.id,
    body, created_at: new Date().toISOString(),
  };
  setState({ messages: [...state.messages, optimistic] });
  if(input) input.value = '';

  const { data, error } = await supabase.from('messages')
    .insert({ couple_id: state.coupleId, sender_id: state.currentUser.id, body })
    .select().single();

  if(error){
    console.error(error);
    return;
  }
  setState({ messages: state.messages.map(m => m.id === optimisticId ? data : m) });
}

/* ============================================================ */
/* Auth actions — name + password only, no email shown anywhere    */
/* ============================================================ */
async function createAccount(){
  const name = state.authName.trim();
  const password = state.authPassword;

  if(!name){ setState({ authError:'Enter your name.' }); return; }
  if(!password || password.length < 6){ setState({ authError:'Password must be at least 6 characters.' }); return; }

  setState({ busy:true, authError:'' });
  const internalEmail = makeInternalEmail(name);
  const { data, error } = await supabase.auth.signUp({
    email: internalEmail, password, options: { data: { name } },
  });
  if(error){ setState({ busy:false, authError: friendlyError(error) }); return; }

  if(!data.session){
    setState({
      busy:false,
      authError:'Signup needs "Confirm email" turned OFF in your Supabase project (Authentication → Settings → Email).',
      screen:'authChoice',
    });
    return;
  }

  const { data: profile, error: profileError } = await supabase
    .from('profiles').select('*').eq('id', data.user.id).single();
  if(profileError){ setState({ busy:false, authError: friendlyError(profileError) }); return; }

  setState({ busy:false, currentUser: profile, screen:'yourCode' });
}

async function loginWithCode(){
  const code = state.authCodeInput.trim().toUpperCase();
  const password = state.authPassword;
  if(!code){ setState({ authError:'Enter your code.' }); return; }
  if(!password){ setState({ authError:'Enter your password.' }); return; }

  setState({ busy:true, authError:'' });
  const { data: email, error } = await supabase.rpc('get_email_for_code', { p_code: code });
  if(error || !email){ setState({ busy:false, authError:'No account found with that code.' }); return; }

  const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
  if(signInError){ setState({ busy:false, authError: friendlyError(signInError) }); return; }

  setState({ busy:false });
  await loadAppData();
}

function finishOnboarding(){
  setState({ screen:'app', activeTab:'today' });
  loadUserData();
}

async function logout(){
  await supabase.auth.signOut();
}

/* ============================================================ */
/* Connect partner                                                 */
/* ============================================================ */
async function connectPartner(codeValue){
  const code = (codeValue || '').trim().toUpperCase();
  if(!code){ setState({ connectError:'Enter a code.' }); return; }

  setState({ busy:true, connectError:'' });
  const { error } = await supabase.rpc('connect_partner', { partner_code: code });
  if(error){ setState({ busy:false, connectError: friendlyError(error) }); return; }

  setState({ busy:false, modal:null, connectInput:'' });
  await loadUserData();
}

async function disconnectPartner(){
  setState({ busy:true });
  const { error } = await supabase.rpc('disconnect_partner');
  if(error){ console.error(error); }
  unsubscribeChat();
  setState({ busy:false, partnerUser:null, partnerGoals:[], coupleId:null, messages:[], modal:null });
  await loadUserData();
}

/* ============================================================ */
/* Goals                                                          */
/* ============================================================ */
async function addGoal(data){
  const { data: goal, error } = await supabase.from('goals').insert({
    user_id: state.currentUser.id,
    title: data.title,
    category: data.category,
    priority: data.priority,
    duration: data.duration || null,
    is_private: !!data.private,
  }).select().single();

  if(error){ alert(friendlyError(error)); return; }
  setState({ goals: [goal, ...state.goals], modal:null });
}

async function toggleGoal(id){
  const goal = state.goals.find(g => g.id === id);
  if(!goal) return;
  const nextDone = !goal.is_done;

  setState({ goals: state.goals.map(g => g.id===id ? { ...g, is_done: nextDone } : g) });

  const { error } = await supabase.from('goals')
    .update({ is_done: nextDone, completed_at: nextDone ? new Date().toISOString() : null })
    .eq('id', id);

  if(error){
    console.error(error);
    alert(friendlyError(error));
    setState({ goals: state.goals.map(g => g.id===id ? { ...g, is_done: !nextDone } : g) });
  }
}

async function deleteGoal(id){
  const prev = state.goals;
  setState({ goals: state.goals.filter(g => g.id !== id) });
  const { error } = await supabase.from('goals').delete().eq('id', id);
  if(error){ console.error(error); setState({ goals: prev }); }
}

/* ============================================================ */
/* Updates + photo upload                                         */
/* ============================================================ */
async function postUpdate(caption, file){
  if(!caption.trim() && !file) return;

  const { data: update, error } = await supabase.from('updates').insert({
    user_id: state.currentUser.id,
    caption: caption.trim() || null,
  }).select().single();

  if(error){ alert(friendlyError(error)); return; }

  if(file){
    const path = `${state.currentUser.id}/updates/${update.id}/${Date.now()}-${file.name}`;
    const { error: uploadError } = await supabase.storage.from('photos').upload(path, file);
    if(uploadError){
      console.error(uploadError);
    } else {
      await supabase.from('update_photos').insert({ update_id: update.id, storage_path: path });
    }
  }

  setState({ modal:null, pendingPhotoFile:null });
  await loadUserData();
}

async function addReaction(updateId, emoji){
  const { error } = await supabase.from('reactions').insert({
    update_id: updateId, user_id: state.currentUser.id, emoji,
  });
  if(error && error.code !== '23505') console.error(error);
  await loadUserData();
}

/* ============================================================ */

function renderProgress(){
  const goals = state.goals;
  const done = goals.filter(g=>g.is_done).length;
  const pct = goals.length ? Math.round((done/goals.length)*100) : 0;
  const byCat = {};
  goals.forEach(g=>{ byCat[g.category] = byCat[g.category] || {total:0,done:0}; byCat[g.category].total++; if(g.is_done) byCat[g.category].done++; });

  return `
    <div style="padding:18px 18px 30px;">
      <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">📊 Your progress</h1>
      <p class="muted" style="font-size:13px; margin-bottom:16px;">Based on the goals you've added</p>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
        <div class="glass" style="padding:16px;">
          <div class="muted" style="font-size:12px; font-weight:600; margin-bottom:6px;">Today</div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:26px;">${pct}%</div>
        </div>
        <div class="glass" style="padding:16px;">
          <div class="muted" style="font-size:12px; font-weight:600; margin-bottom:6px;">Total goals done</div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:26px;">${done}</div>
        </div>
      </div>

      <h3 style="font-size:14px; font-weight:700; margin-bottom:10px;">By category</h3>
      ${Object.keys(byCat).length===0
        ? `<div class="empty-state"><div class="em">📊</div><div style="font-size:13px;">Add goals to see your breakdown here.</div></div>`
        : Object.entries(byCat).map(([cat,v])=>{
            const p = v.total ? Math.round((v.done/v.total)*100) : 0;
            return `
              <div class="glass" style="padding:14px; margin-bottom:8px; display:flex; align-items:center; gap:12px;">
                <div class="icon-badge done">${CATEGORY_EMOJI[cat]}</div>
                <div style="flex:1;">
                  <div style="font-size:13px; font-weight:600; margin-bottom:4px;">${CATEGORY_LABEL[cat]||cat}</div>
                  <div style="width:100%; height:5px; border-radius:999px; background:var(--glass-border);">
                    <div style="width:${p}%; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--purple),var(--pink));"></div>
                  </div>
                </div>
                <div class="muted" style="font-size:12px; font-weight:700;">${v.done}/${v.total}</div>
              </div>`;
          }).join('')}
    </div>`;
}

/* ============================================================ */
/* Master render                                                  */
/* ============================================================ */
function render(){
  const root = document.getElementById('screen');
  document.getElementById('app').setAttribute('data-theme', state.theme);
  document.documentElement.setAttribute('data-theme', state.theme);

  let body = '';
  if(state.screen==='loading') body = renderLoading();
  else if(state.screen==='authChoice') body = renderAuthChoice();
  else if(state.screen==='create') body = renderCreateForm();
  else if(state.screen==='login') body = renderLoginForm();
  else if(state.screen==='yourCode') body = renderYourCode();
  else if(state.screen==='app'){
    const screens = { today:renderToday, goals:renderGoals, chat:renderChat, updates:renderUpdates, progress:renderProgress, together:renderTogether };
    body = (screens[state.activeTab]||renderToday)();
  }

  const withTopbar = ['app'].includes(state.screen);
  root.innerHTML = `
    ${withTopbar ? renderTopbar() : ''}
    ${body}
    ${state.screen==='app' ? renderBottomNav() : ''}
    ${renderModal()}
  `;

  bindInputs();

  if(state.screen==='app' && state.activeTab==='chat'){
    const list = document.getElementById('chat-list');
    if(list && state.messages.length !== lastRenderedMessageCount){
      list.scrollIntoView({ block:'end' });
      lastRenderedMessageCount = state.messages.length;
    }
    const chatInput = document.getElementById('chat-input');
    if(chatInput){
      chatInput.addEventListener('input', () => {
        notifyTyping();
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 90) + 'px';
      });
      chatInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault();
          sendChatMessage();
        }
      });
      chatInput.focus();
    }
  }
}

/* ============================================================ */
/* Input bindings                                                 */
/* ============================================================ */
function bindInputs(){
  const nameInput = document.getElementById('name-input');
  if(nameInput) nameInput.addEventListener('input', e => state.authName = e.target.value);

  const passwordInput = document.getElementById('password-input');
  if(passwordInput) passwordInput.addEventListener('input', e => state.authPassword = e.target.value);

  const loginCodeInput = document.getElementById('login-code-input');
  if(loginCodeInput) loginCodeInput.addEventListener('input', e => state.authCodeInput = e.target.value);

  const connectNow = document.getElementById('connect-now-input');
  if(connectNow) connectNow.addEventListener('input', e => state.connectInput = e.target.value);

  const photoInput = document.getElementById('update-photo-input');
  if(photoInput) photoInput.addEventListener('change', e => {
    state.pendingPhotoFile = e.target.files[0] || null;
    render();
  });
}

/* ============================================================ */
/* Event delegation                                               */
/* ============================================================ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  // Only the overlay background itself should close a modal.
  // Prevent clicks on inputs/selects inside the modal from being
  // interpreted as a click on the overlay.
  if(action==='close-modal' && e.target !== el) return;

  if(action==='toggle-theme') setState({ theme: state.theme==='dark'?'light':'dark' });
  else if(action==='goto-create') setState({ screen:'create', authError:'' });
  else if(action==='goto-login') setState({ screen:'login', authError:'' });
  else if(action==='goto-choice') setState({ screen:'authChoice', authError:'' });
  else if(action==='submit-create') createAccount();
  else if(action==='submit-login') loginWithCode();
  else if(action==='copy-code'){
    const code = state.currentUser?.code || '';
    try{
      await navigator.clipboard.writeText(code);
      alert('Code copied!');
    }catch(_){
      // Clipboard API can be unavailable on file:// or insecure contexts.
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); alert('Code copied!'); }
      catch(e){ alert('Your code is: ' + code); }
      ta.remove();
    }
  }
  else if(action==='connect-now'){
    await connectPartner(state.connectInput);
    if(!state.connectError) finishOnboarding();
  }
  else if(action==='skip-connect') finishOnboarding();
  else if(action==='tab') setState({ activeTab: el.getAttribute('data-tab') });
  else if(action==='open-add') setState({ modal:'addChoice' });
  else if(action==='open-add-goal') setState({ modal:'addGoal' });
  else if(action==='open-add-update') setState({ modal:'addUpdate', pendingPhotoFile:null });
  else if(action==='open-connect' || action==='open-connect-from-settings') setState({ modal:'connect', connectError:'' });
  else if(action==='open-settings') {
    setState({ modal:'settings' });
    loadPushStatus();
  }
  else if(action==='enable-notifications') enablePushNotifications();
  else if(action==='disable-notifications') disablePushNotifications();
  else if(action==='close-modal') history.back();
  else if(action==='do-logout') logout();
  else if(action==='disconnect-partner') disconnectPartner();
  else if(action==='filter-goals'){ goalsFilter = el.getAttribute('data-filter'); render(); }
  else if(action==='toggle-goal') toggleGoal(el.getAttribute('data-id'));
  else if(action==='delete-goal') deleteGoal(el.getAttribute('data-id'));
  else if(action==='react') addReaction(el.getAttribute('data-update-id'), el.getAttribute('data-emoji'));
  else if(action==='send-chat') sendChatMessage();
  else if(action==='submit-connect'){
    const val = document.getElementById('connect-input')?.value || '';
    connectPartner(val);
  }
  else if(action==='submit-goal'){
    const title = document.getElementById('goal-title')?.value.trim();
    if(!title) return;
    const category = document.getElementById('goal-category')?.value;
    const duration = document.getElementById('goal-duration')?.value.trim();
    const priority = document.getElementById('goal-priority')?.value;
    const priv = document.getElementById('goal-private')?.checked;
    addGoal({ title, category, duration, priority, private:priv });
  }
  else if(action==='submit-update'){
    const caption = document.getElementById('update-caption')?.value || '';
    postUpdate(caption, state.pendingPhotoFile);
  }
});

/* ============================================================ */
/* Init                                                           */
/* ============================================================ */
render();
restoreSession();

})();
</script>

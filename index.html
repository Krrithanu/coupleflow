<html lang="en">

<title>CoupleFlow</title>

<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg-grad: linear-gradient(160deg, #F6F2FF 0%, #FFF3FA 48%, #EEF5FF 100%);
    --ink: #2B2640;
    --ink-soft: #847CA0;
    --ink-faint: #B0A8C8;
    --glass: rgba(255,255,255,0.58);
    --glass-strong: rgba(255,255,255,0.82);
    --glass-border: rgba(255,255,255,0.9);
    --solid: #FFFFFF;
    --purple: #9B87F5;
    --purple-deep: #7657E0;
    --pink: #F2A6CE;
    --pink-deep: #E8639F;
    --blue: #9DC3F2;
    --nav-bg: rgba(255,255,255,0.75);
    --shadow: 0 20px 45px -20px rgba(118,87,224,0.28);
    --shadow-soft: 0 10px 30px -14px rgba(118,87,224,0.22);
  }
  [data-theme="dark"]{
    --bg-grad: linear-gradient(160deg, #191529 0%, #1E1726 48%, #161A26 100%);
    --ink: #F2EEFB;
    --ink-soft: #B4A9D4;
    --ink-faint: #756D93;
    --glass: rgba(46,38,68,0.55);
    --glass-strong: rgba(52,43,76,0.78);
    --glass-border: rgba(255,255,255,0.08);
    --solid: #241D34;
    --purple: #A997FF;
    --purple-deep: #8B72F0;
    --pink: #F0A8D2;
    --pink-deep: #E37AB8;
    --blue: #8FB8EE;
    --nav-bg: rgba(30,24,46,0.8);
    --shadow: 0 20px 45px -20px rgba(0,0,0,0.55);
    --shadow-soft: 0 10px 30px -14px rgba(0,0,0,0.45);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; } }

  html,body{
    margin:0;
    width:100%;
    font-family:'Inter',sans-serif;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overscroll-behavior-y:none;
  }
  body{ min-height:100dvh; background:var(--bg-grad); }
  input,select,textarea{ font-size:16px; }

  #app{
    position:relative;
    width:100%;
    max-width:560px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }

  .blob{ position:fixed; border-radius:50%; filter:blur(60px); pointer-events:none; z-index:0; }
  .blob-1{ top:-80px; right:-60px; width:280px; height:280px; background:color-mix(in srgb, var(--purple) 30%, transparent); }
  .blob-2{ bottom:0; left:-90px; width:260px; height:260px; background:color-mix(in srgb, var(--pink) 28%, transparent); }

  #screen{ position:relative; flex:1; z-index:1; padding-bottom:96px; }

  .glass{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:26px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:var(--shadow-soft);
  }
  .glass-strong{ background:var(--glass-strong); }

  h1,h2,h3,.heading{ font-family:'Plus Jakarta Sans',sans-serif; color:var(--ink); margin:0; }
  p,span,div,button,input,select,textarea,label{ color:var(--ink); }
  .muted{ color:var(--ink-soft); }
  .faint{ color:var(--ink-faint); }

  button{ font-family:'Inter',sans-serif; cursor:pointer; }
  input,select,textarea{ font-family:'Inter',sans-serif; }
  ::placeholder{ color:var(--ink-faint); }

  .btn-primary{
    width:100%; padding:14px 0; border-radius:18px; border:none;
    background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14.5px;
    box-shadow:0 10px 24px -10px rgba(118,87,224,0.55);
  }
  .btn-primary:disabled{ opacity:.6; }
  .btn-secondary{
    width:100%; padding:13px 0; border-radius:18px; cursor:pointer;
    border:1px solid var(--glass-border); background:var(--glass); color:var(--ink);
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:14px;
  }
  .input{
    width:100%; border:1px solid var(--glass-border); border-radius:16px; padding:13px 14px;
    font-size:16px; color:var(--ink); background:var(--glass); outline:none; margin-bottom:12px;
  }
  .input:focus{ border-color:var(--purple); }

  .tag{
    font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px;
    display:inline-flex; align-items:center; gap:4px; background:color-mix(in srgb, var(--purple) 14%, transparent);
  }
  .tag.pink{ background:color-mix(in srgb, var(--pink) 20%, transparent); }
  .tag.blue{ background:color-mix(in srgb, var(--blue) 22%, transparent); }

  .icon-badge{
    width:40px; height:40px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-size:18px; background:var(--glass-strong); border:1px solid var(--glass-border);
  }
  .icon-badge.done{
    background:linear-gradient(135deg,var(--purple),var(--pink)); border:none;
    box-shadow:0 6px 14px -6px rgba(118,87,224,0.5);
  }

  .checkbox-btn{
    width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--ink-faint); background:transparent; transition:all .25s; color:#fff; font-size:14px;
  }
  .checkbox-btn.done{ border:none; background:linear-gradient(135deg,var(--purple),var(--pink)); }

  #bottomnav{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%);
    width:min(560px,100%); display:flex; justify-content:center;
    padding:10px 8px calc(12px + env(safe-area-inset-bottom));
    z-index:100; pointer-events:none;
  }
  #navbar{
    width:100%; max-width:560px; display:flex; align-items:center; justify-content:space-between;
    gap:2px; padding:8px; background:var(--nav-bg); border-radius:26px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--glass-border); box-shadow:var(--shadow); pointer-events:auto;
  }
  .navitem{
    flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:6px 4px; border-radius:16px; border:none; background:transparent;
  }
  .navitem.active{ background:color-mix(in srgb, var(--purple) 14%, transparent); }
  .navitem .ic{ font-size:17px; line-height:1; }
  .navitem .lb{ font-size:9px; font-weight:600; color:var(--ink-faint); }
  .navitem.active .lb{ color:var(--purple-deep); }

  #fab{
    width:44px; height:44px; border-radius:50%; border:none; margin:0 2px; flex-shrink:0;
    background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 22px -8px rgba(118,87,224,0.6);
  }

  .topbar{
    position:sticky; top:0; display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 18px 14px; z-index:20;
    background:linear-gradient(180deg, var(--bg-grad) 62%, transparent);
  }
  .round-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--glass-border); flex-shrink:0;
    background:var(--glass); backdrop-filter:blur(12px);
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }

  .modal-overlay{
    position:fixed; inset:0; z-index:9999; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(20,15,35,0.38); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    animation: fadeIn .16s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .modal-sheet{
    position:relative; z-index:10000; box-sizing:border-box;
    width:100%; max-width:430px; margin:0 auto; background:var(--solid);
    border-radius:28px 28px 0 0;
    padding:12px 20px max(32px, calc(32px + env(safe-area-inset-bottom)));
    box-shadow:0 -8px 35px rgba(30,20,50,0.15);
    max-height:90dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    animation: sheetUp .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheetUp{ from{ transform:translateY(24px); opacity:.6 } to{ transform:translateY(0); opacity:1 } }
  .drag-handle{ width:40px; height:4px; border-radius:999px; background:var(--glass-border); margin:6px auto 18px; }

  .photo-placeholder{
    width:100%; height:130px; border-radius:18px; margin-bottom:12px;
    background:linear-gradient(135deg,color-mix(in srgb, var(--purple) 20%, transparent),color-mix(in srgb, var(--pink) 18%, transparent));
    border:1.5px dashed var(--ink-faint);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:26px;
  }
  .photo-note{ font-size:11px; color:var(--ink-faint); text-align:center; }

  .empty-state{ text-align:center; padding:46px 20px; color:var(--ink-soft); }
  .empty-state .em{ font-size:34px; margin-bottom:10px; }

  .code-display{
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:32px; letter-spacing:6px;
    text-align:center; color:var(--purple-deep); padding:18px 0;
  }

  .auth-tab{
    padding:10px 0; border-radius:14px; border:1px solid var(--glass-border);
    background:var(--glass); font-weight:600; font-size:13px; color:var(--ink-soft);
  }
  .auth-tab.active{ background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff; border:none; }

  .error-text{ color:var(--pink-deep); font-size:12.5px; margin:-4px 0 12px; font-weight:500; }
  .center-col{ display:flex; flex-direction:column; justify-content:center; min-height:100dvh; padding:28px 24px; }

  .avatar{
    border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; flex-shrink:0;
  }

  .toast{
    position:fixed; left:50%; bottom:calc(104px + env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:12000;
    background:var(--ink); color:var(--solid);
    padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600;
    box-shadow:0 10px 30px rgba(20,12,40,.3);
    animation: toastIn .2s ease;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%,8px) } to{ opacity:1; transform:translate(-50%,0) } }

  /* ============ CHAT ============ */
  #app.chat-mode{ height:100dvh; overflow:hidden; }
  #app.chat-mode #screen{ display:flex; flex-direction:column; overflow:hidden; height:100dvh; padding-bottom:0; }

  .chat-screen{
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden;
    background:
      radial-gradient(circle at 15% 8%, color-mix(in srgb, var(--purple) 10%, transparent), transparent 42%),
      radial-gradient(circle at 85% 92%, color-mix(in srgb, var(--pink) 10%, transparent), transparent 42%),
      var(--bg-grad);
  }

  .chat-header{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 11px;
    background:var(--glass-strong); border-bottom:1px solid var(--glass-border);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  .chat-avatar{
    width:38px; height:38px; border-radius:50%; flex:0 0 38px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    color:#fff; font-size:14px; font-weight:800;
  }
  .chat-header-info{ min-width:0; flex:1; }
  .chat-header-name{ font-size:15px; font-weight:800; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-header-status{ font-size:11px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .chat-menu-wrap{ position:relative; }
  .chat-menu-panel{
    position:absolute; right:0; top:calc(100% + 10px); min-width:170px;
    background:var(--solid); border:1px solid var(--glass-border); border-radius:16px;
    box-shadow:var(--shadow); overflow:hidden; z-index:40;
  }
  .chat-menu-item{
    width:100%; padding:12px 14px; border:none; background:transparent; text-align:left;
    font-size:13px; font-weight:600; color:var(--ink);
    border-bottom:1px solid color-mix(in srgb, var(--ink-faint) 18%, transparent);
  }
  .chat-menu-item:last-child{ border-bottom:none; }

   #chat-list{
    flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:14px 12px; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; scrollbar-width:none;
    display:flex; flex-direction:column;
  }
  /* pushes a short conversation down so it sits just above the composer,
     while still scrolling normally once it overflows */
  #chat-inner{ margin-top:auto; width:100%; }
  #chat-list::-webkit-scrollbar{ display:none; width:0; }

  .chat-date-sep{ display:flex; justify-content:center; margin:14px 0 10px; }
  .chat-date-sep span{
    font-size:11px; font-weight:600; color:var(--ink-soft);
    background:var(--glass); padding:4px 12px; border-radius:999px; border:1px solid var(--glass-border);
  }

  .chat-msg{ display:flex; width:100%; align-items:flex-end; gap:6px; margin:1px 0; }
  .chat-msg.group-start{ margin-top:10px; }
  .chat-msg.mine{ justify-content:flex-end; }
  .chat-msg.theirs{ justify-content:flex-start; }

  .chat-bubble-wrap{ max-width:76%; min-width:0; display:flex; flex-direction:column; }
  .chat-msg.mine .chat-bubble-wrap{ align-items:flex-end; }
  .chat-msg.theirs .chat-bubble-wrap{ align-items:flex-start; }

  .chat-avatar-sm{
    width:24px; height:24px; border-radius:50%; flex:0 0 24px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    color:#fff; font-size:10px; font-weight:800;
  }

  .chat-bubble{
    display:inline-block; max-width:100%; box-sizing:border-box;
    padding:10px 14px; border-radius:20px;
    font-size:14.5px; line-height:1.42;
    word-break:break-word; white-space:pre-wrap;
    box-shadow:0 1px 3px rgba(30,20,50,0.07);
    animation: bubbleIn .18s ease;
  }
  /* tail only on the last bubble of a group */
  .chat-msg.tail.mine .chat-bubble{ border-bottom-right-radius:6px; }
  .chat-msg.tail.theirs .chat-bubble{ border-bottom-left-radius:6px; }

  @keyframes bubbleIn{ from{ opacity:0; transform:translateY(4px) } to{ opacity:1; transform:translateY(0) } }
    .chat-msg.mine .chat-bubble{
    background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff;
  }
  .chat-msg.theirs .chat-bubble{
    background:var(--solid); color:var(--ink); border:1px solid var(--glass-border);
  }
  .chat-msg.pending .chat-bubble{ opacity:.72; }

  .chat-time{ font-size:10px; color:var(--ink-faint); margin-top:2px; padding:0 4px; }
  .chat-msg.mine .chat-time{ text-align:right; }

  .typing-bubble{ padding:10px 14px !important; }
  .typing-dots{ display:inline-flex; align-items:center; gap:3px; }
  .typing-dots span{
    width:6px; height:6px; border-radius:50%; background:var(--ink-faint);
    animation: typingBounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes typingBounce{
    0%,60%,100%{ transform:translateY(0); opacity:.45 }
    30%{ transform:translateY(-4px); opacity:1 }
  }

  .chat-empty-content{
    min-height:100%; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
  }

  #chat-input-bar{
    flex:0 0 auto; display:flex; align-items:flex-end; gap:8px;
    width:100%; box-sizing:border-box;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:var(--glass-strong); border-top:1px solid var(--glass-border);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  #chat-input{
    flex:1 1 auto; min-width:0; min-height:42px; max-height:110px; box-sizing:border-box;
    padding:11px 16px; border:1px solid var(--glass-border); border-radius:21px;
    outline:none; resize:none; background:var(--solid); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:16px; line-height:1.35;
    -webkit-appearance:none; appearance:none;
  }
  #chat-input:focus{ border-color:rgba(155,135,245,.5); }
  #chat-send{
    flex:0 0 42px; width:42px; height:42px; border:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    color:#fff; font-size:16px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  #chat-send:active{ transform:scale(.94); }

  @media(max-width:380px){
    #chat-list{ padding:12px 8px; }
    .chat-bubble-wrap{ max-width:82%; }
  }

/* ============================================================ */
/* CoupleFlow 2.0 Phase 1–4 polish                              */
/* ============================================================ */
.cf2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cf2-card{position:relative;overflow:hidden;padding:16px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--shadow-soft);transition:transform .22s ease,box-shadow .22s ease}
.cf2-card:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 20% 20%,rgba(155,135,245,.16),transparent 38%),radial-gradient(circle at 80% 70%,rgba(242,166,206,.16),transparent 36%);pointer-events:none}
.cf2-card:active{transform:scale(.985)}
.cf2-icon{font-size:27px;margin-bottom:8px}
.cf2-title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:14px}
.cf2-sub{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.4}
.cf2-chip{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-border);font-size:11px;font-weight:700}
.cf2-progress{height:8px;border-radius:99px;background:rgba(127,110,180,.12);overflow:hidden}.cf2-progress>i{display:block;height:100%;width:var(--p,0%);border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--pink),var(--blue));animation:cf2Grow .8s ease both}
@keyframes cf2Grow{from{width:0}}@keyframes cf2Pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.cf2-pop{animation:cf2Pop .45s cubic-bezier(.2,.9,.2,1) both}.cf2-float{animation:cf2Float 4s ease-in-out infinite}@keyframes cf2Float{50%{transform:translateY(-6px) rotate(1deg)}}
.cf2-stat{font-size:24px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif}.cf2-mini{font-size:10px;color:var(--ink-soft)}
.cf2-section{margin:18px 0 10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:14px}
.cf2-list{display:flex;flex-direction:column;gap:8px}.cf2-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--glass-border)}
.cf2-row input,.cf2-row textarea{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:inherit}
.cf2-pill-btn{border:0;border-radius:999px;padding:9px 12px;background:linear-gradient(135deg,var(--purple),var(--pink));color:white;font-weight:800;cursor:pointer}
.cf2-modal{max-height:min(86dvh,760px);overflow:auto}.cf2-empty{text-align:center;padding:18px;color:var(--ink-soft);font-size:12px}
.cf2-hero{padding:20px;border-radius:25px;background:linear-gradient(135deg,color-mix(in srgb,var(--purple) 18%,transparent),color-mix(in srgb,var(--pink) 16%,transparent),color-mix(in srgb,var(--blue) 14%,transparent));border:1px solid var(--glass-border);box-shadow:var(--shadow);position:relative;overflow:hidden}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}

function makeInternalEmail(name){

/* ============================================================ */

const CATEGORY_EMOJI = { study:'📚', fitness:'🏋️', code:'💻', creative:'🎨', learning:'🧠', habit:'🌱' };
const CATEGORY_LABEL = { study:'Study', fitness:'Fitness', code:'Coding', creative:'Creative', learning:'Learning', habit:'Habit' };

let lastNavKey = null;

function setState(patch, opts={}){
  state = { ...state, ...patch };
  const navKey = `${state.screen}|${state.activeTab}|${state.modal}`;
  if(opts.fromPopstate){
    lastNavKey = navKey;
  } else if(navKey !== lastNavKey){
    history.pushState({ screen:state.screen, activeTab:state.activeTab, modal:state.modal }, '');
    lastNavKey = navKey;
  }
  render();
}

let toastTimer = null;
function showToast(msg){
  clearTimeout(toastTimer);
  state.toast = msg;
  render();
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 2200);
}

window.addEventListener('popstate', (e) => {
  const target = e.state;
  if(!target){
    const fallback = state.currentUser
      ? { screen:'app', activeTab: state.activeTab || 'today', modal:null }
      : { screen:'authChoice', modal:null };
    history.replaceState(fallback,'');
    setState(fallback, { fromPopstate:true });
    return;
  }
  if(state.currentUser && AUTH_ONLY_SCREENS.includes(target.screen)){
    const fixed = { screen:'app', activeTab: state.activeTab || 'today', modal:null };
    history.replaceState(fixed,'');
    setState(fixed, { fromPopstate:true });
    return;
  }
  setState({
    screen: target.screen,
    activeTab: target.activeTab || state.activeTab,
    modal: target.modal || null,
    chatMenuOpen:false,
  }, { fromPopstate:true });
});

/* ============================================================ */
/* Utilities                                                     */
/* ============================================================ */
function initials(name){ return (name||'?').trim()[0]?.toUpperCase() || '?'; }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function timeAgo(ts){
  const m = Math.floor((Date.now() - new Date(ts).getTime())/60000);
  if(m < 1) return 'Just now';
  if(m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if(h < 24) return `${h}h ago`;
  return new Date(ts).toLocaleDateString();
}
function timeShort(ts){
  return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}
function friendlyError(e){ return e?.message || 'Something went wrong. Please try again.'; }

/* ============================================================ */
/* Session                                                       */
/* ============================================================ */
async function restoreSession(){
  try{
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){ showAuthChoice(); return; }
    const { data:{ user }, error } = await supabase.auth.getUser();
    if(error || !user){
      await supabase.auth.signOut({ scope:'local' });
      showAuthChoice();
      return;
    }
    await loadAppData();
  }catch(err){
    console.error('Session check failed:', err);
    try{ await supabase.auth.signOut({ scope:'local' }); }catch(_){}
    showAuthChoice();
  }
}

function showAuthChoice(){
  history.replaceState({ screen:'authChoice', modal:null },'');
  lastNavKey = 'authChoice|today|null';
  setState({ screen:'authChoice' }, { fromPopstate:true });
}

supabase.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_OUT'){
    unsubscribeChat();
    history.replaceState({ screen:'authChoice', modal:null },'');
    setState({
      currentUser:null, partnerUser:null, coupleId:null,
      goals:[], partnerGoals:[], updates:[], messages:[], partnerTyping:false,
      screen:'authChoice', authName:'', authCodeInput:'', authPassword:'',
      authError:'', modal:null, chatMenuOpen:false,
    }, { fromPopstate:true });
  }
});

/* ============================================================ */
/* Data loading                                                  */
/* ============================================================ */
async function loadAppData(){
  try{
    const { data:{ user } } = await supabase.auth.getUser();
    if(!user){ showAuthChoice(); return; }

    const { data:profile, error } = await supabase
      .from('profiles').select('*').eq('id', user.id).single();
    if(error) throw error;

    state.currentUser = profile;
    await loadUserData();
    history.replaceState({ screen:'app', activeTab:'today', modal:null },'');
    lastNavKey = 'app|today|null';
    setState({ currentUser:profile, screen:'app', activeTab:'today' }, { fromPopstate:true });
    try{ await syncExistingPushSubscription(); }
    catch(e){ console.warn('Push sync failed:', e); }
  }catch(err){
    console.error(err);
    try{ await supabase.auth.signOut({ scope:'local' }); }catch(_){}
    history.replaceState({ screen:'authChoice', modal:null },'');
    setState({ screen:'authChoice', authError: friendlyError(err) }, { fromPopstate:true });
  }
}

async function getCoupleAndPartner(){
  const me = state.currentUser.id;
  const { data:couple, error } = await supabase
    .from('couples').select('id, user1_id, user2_id')
    .or(`user1_id.eq.${me},user2_id.eq.${me}`)
    .maybeSingle();
  if(error || !couple) return { couple:null, partner:null };
  const partnerId = couple.user1_id === me ? couple.user2_id : couple.user1_id;
  const { data:partner, error:pErr } = await supabase
    .from('profiles').select('*').eq('id', partnerId).single();
  return { couple, partner: pErr ? null : partner };
}

async function loadUserData(){
  const me = state.currentUser;
  if(!me) return;

  const [goals, { couple, partner }] = await Promise.all([ getMyGoals(), getCoupleAndPartner() ]);
  const partnerGoals = partner ? await getPartnerGoals(partner.id) : [];
  const updates = await getUpdatesFeed(me, partner);
  const messages = couple ? await loadMessages(couple.id) : [];

  state.goals = goals; state.partnerUser = partner; state.partnerGoals = partnerGoals; state.updates = updates; state.coupleId = couple ? couple.id : null; state.messages = messages;
  cf2Sync();
  setState({
    goals, partnerUser:partner, partnerGoals, updates,
    coupleId: couple ? couple.id : null, messages,
  });

  if(couple){ subscribeToChat(couple.id); cf2HydrateRemote(); } else unsubscribeChat();
}

async function getMyGoals(){
  const { data, error } = await supabase
    .from('goals').select('*')
    .eq('user_id', state.currentUser.id)
    .order('created_at', { ascending:false });
  if(error){ console.error(error); return []; }
  return data;
}

async function getPartnerGoals(partnerId){
  const { data, error } = await supabase
    .from('goals').select('*')
    .eq('user_id', partnerId)
    .order('created_at', { ascending:false });
  if(error){ console.error(error); return []; }
  return data;
}

async function getUpdatesFeed(me, partner){
  const ids = partner ? [me.id, partner.id] : [me.id];
  const { data, error } = await supabase
    .from('updates')
    .select('*, update_photos(id, storage_path), reactions(id, emoji, user_id)')
    .in('user_id', ids)
    .order('created_at', { ascending:false })
    .limit(50);
  if(error){ console.error(error); return []; }

  return await Promise.all(data.map(async (u) => {
    let photoUrl = null;
    if(u.update_photos?.length){
      const { data:signed } = await supabase.storage
        .from('photos').createSignedUrl(u.update_photos[0].storage_path, 3600);
      photoUrl = signed?.signedUrl || null;
    }
    return {
      ...u,
      authorName: u.user_id === me.id ? me.name : (partner?.name || 'Partner'),
      mine: u.user_id === me.id,
      photoUrl,
      reactions: u.reactions || [],
    };
  }));
}

/* ============================================================ */
/* Chat                                                          */
/* ============================================================ */
let chatChannel = null;
let subscribedCoupleId = null;
let lastRenderedMessageCount = 0;
let typingHideTimer = null;
let typingSentAt = 0;

async function loadMessages(coupleId){
  const { data, error } = await supabase
    .from('messages').select('*')
    .eq('couple_id', coupleId)
    .order('created_at', { ascending:true })
    .limit(300);
  if(error){ console.error(error); return []; }
  return data;
}

function subscribeToChat(coupleId){
  if(subscribedCoupleId === coupleId && chatChannel) return;
  unsubscribeChat();

  chatChannel = supabase
    .channel(`couple-${coupleId}`)
    .on('postgres_changes',
      { event:'INSERT', schema:'public', table:'messages', filter:`couple_id=eq.${coupleId}` },
      (payload) => {
        if(payload.new.sender_id === state.currentUser.id) return;
        if(state.messages.some(m => m.id === payload.new.id)) return;
        state.messages = [...state.messages, payload.new];
        state.partnerTyping = false;
        clearTimeout(typingHideTimer);
        if(state.screen === 'app' && state.activeTab === 'chat'){
          refreshChatList();
          updateTypingStatusUI();
        }
      }
    )
    .on('broadcast', { event:'typing' }, (payload) => {
      if(payload.payload?.userId === state.currentUser.id) return;
      state.partnerTyping = true;
      if(state.screen === 'app' && state.activeTab === 'chat'){
        refreshChatList();
        updateTypingStatusUI();
      }
      clearTimeout(typingHideTimer);
      typingHideTimer = setTimeout(() => {
        state.partnerTyping = false;
        if(state.screen === 'app' && state.activeTab === 'chat'){
          refreshChatList();
          updateTypingStatusUI();
        }
      }, 2500);
    })
    .subscribe();

  subscribedCoupleId = coupleId;
}

function unsubscribeChat(){
  if(chatChannel){ supabase.removeChannel(chatChannel); chatChannel = null; }
  subscribedCoupleId = null;
}

function notifyTyping(){
  if(!chatChannel) return;
  const now = Date.now();
  if(now - typingSentAt < 1500) return;
  typingSentAt = now;
  chatChannel.send({ type:'broadcast', event:'typing', payload:{ userId: state.currentUser.id } });
}

function formatDateLabel(ts){
  const d = new Date(ts), now = new Date();
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if(d.toDateString() === now.toDateString()) return 'Today';
  if(d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], {
    month:'short', day:'numeric',
    year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined,
  });
}

function buildChatHtml(messages){
  if(!messages.length){
    return `<div class="chat-empty-content" style="margin:auto 0;"><div class="empty-state">
      <div class="em">💬</div>
      <div style="font-size:13px;font-weight:600;">Say hi — this is just between you two.</div>
    </div></div>`;
  }

  const partnerInitial = state.partnerUser?.name ? initials(state.partnerUser.name) : '♡';
  let html = '', lastDateLabel = null, lastSenderId = null, lastTs = 0;

  messages.forEach((m, idx) => {
    const dateLabel = formatDateLabel(m.created_at);
    if(dateLabel !== lastDateLabel){
      html += `<div class="chat-date-sep"><span>${dateLabel}</span></div>`;
      lastDateLabel = dateLabel;
      lastSenderId = null;
    }

    const mine = m.sender_id === state.currentUser.id;
    const sameGroup = m.sender_id === lastSenderId && (new Date(m.created_at) - lastTs) < 5*60*1000;
    const next = messages[idx+1];
    const isGroupEnd = !next
      || next.sender_id !== m.sender_id
      || (new Date(next.created_at) - new Date(m.created_at)) >= 5*60*1000
      || formatDateLabel(next.created_at) !== dateLabel;

    const pending = String(m.id).startsWith('temp-');

    
        html += `
      <div class="chat-msg ${mine?'mine':'theirs'} ${sameGroup?'':'group-start'} ${isGroupEnd?'tail':''} ${pending?'pending':''}">${!mine ? `<div class="chat-avatar-sm" style="visibility:${isGroupEnd?'visible':'hidden'}">${escapeHtml(partnerInitial)}</div>` : ''}
        <div class="chat-bubble-wrap">
          <div class="chat-bubble">${escapeHtml(m.body)}</div>
          ${isGroupEnd ? `<div class="chat-time">${timeShort(m.created_at)}${pending?' · sending…':''}</div>` : ''}
        </div>
      </div>`;

    lastSenderId = m.sender_id;
    lastTs = new Date(m.created_at);
  });

  return html;
}

function typingBubbleHtml(){
  const partnerInitial = state.partnerUser?.name ? initials(state.partnerUser.name) : '♡';
  return `
    <div class="chat-msg theirs group-start">
      <div class="chat-avatar-sm">${escapeHtml(partnerInitial)}</div>
      <div class="chat-bubble-wrap">
        <div class="chat-bubble typing-bubble">
          <span class="typing-dots"><span></span><span></span><span></span></span>
        </div>
      </div>
    </div>`;
}

function messagesHtml(){
  const inner = buildChatHtml(state.messages) + (state.partnerTyping ? typingBubbleHtml() : '');
  // #chat-inner has margin-top:auto so short conversations hug the composer
  return `<div id="chat-inner">${inner}</div>`;
}

function refreshChatList(){
  const list = document.getElementById('chat-list');
  if(!list) return;
  const nearBottom = (list.scrollHeight - list.scrollTop - list.clientHeight) < 160;
  const countChanged = state.messages.length !== lastRenderedMessageCount;
  list.innerHTML = messagesHtml();
  if(nearBottom || countChanged || state.messages.length === 0){
    list.scrollTop = list.scrollHeight;
  }
  lastRenderedMessageCount = state.messages.length;
}

function updateTypingStatusUI(){
  const el = document.querySelector('.chat-header-status');
  if(el && state.partnerUser){
    el.textContent = state.partnerTyping ? 'typing…' : 'Private chat · just you two';
  }
}

function scrollChatToBottom(){
  const list = document.getElementById('chat-list');
  if(list) list.scrollTop = list.scrollHeight;
}

let chatViewportWatched = false;
function watchChatViewport(){
  if(chatViewportWatched || !window.visualViewport) return;
  chatViewportWatched = true;
  const onChange = () => {
    if(!(state.screen === 'app' && state.activeTab === 'chat')) return;
    requestAnimationFrame(scrollChatToBottom);
    setTimeout(scrollChatToBottom, 120);
    setTimeout(scrollChatToBottom, 320);
  };
  window.visualViewport.addEventListener('resize', onChange);
  window.visualViewport.addEventListener('scroll', onChange);
}

async function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const body = (input?.value || '').trim();
  if(!body || !state.coupleId || !state.partnerUser) return;

  const optimisticId = `temp-${Date.now()}`;
  state.messages = [...state.messages, {
    id: optimisticId,
    couple_id: state.coupleId,
    sender_id: state.currentUser.id,
    body,
    created_at: new Date().toISOString(),
  }];
  refreshChatList();

  if(input){
    input.value = '';
    input.style.height = 'auto';
    input.focus({ preventScroll:true });
  }
  requestAnimationFrame(scrollChatToBottom);

  const { data, error } = await supabase
    .from('messages')
    .insert({ couple_id: state.coupleId, sender_id: state.currentUser.id, body })
    .select().single();

  if(error){
    console.error('Message send failed:', error);
    state.messages = state.messages.filter(m => m.id !== optimisticId);
    refreshChatList();
    showToast('Message failed to send');
    return;
  }

  state.messages = state.messages.map(m => m.id === optimisticId ? data : m);
  refreshChatList();
  requestAnimationFrame(scrollChatToBottom);

  try{
    await supabase.functions.invoke('push-notifications', {
      body: {
        recipient_id: state.partnerUser.id,
        type: 'message',
        actor_id: state.currentUser.id,
        actor_name: state.currentUser.name,
        message: body,
        title: `New message from ${state.currentUser.name}`,
        body,
        url: '/?tab=chat'
      }
    });
  }catch(e){ console.error('Push trigger failed:', e); }
}

/* ============================================================ */
/* Auth                                                          */
/* ============================================================ */
async function createAccount(){
  const name = state.authName.trim();
  const password = state.authPassword;
  if(!name){ setState({ authError:'Enter your name.' }); return; }
  if(!password || password.length < 6){ setState({ authError:'Password must be at least 6 characters.' }); return; }

  setState({ busy:true, authError:'' });
  const { data, error } = await supabase.auth.signUp({
    email: makeInternalEmail(name), password, options:{ data:{ name } },
  });
  if(error){ setState({ busy:false, authError: friendlyError(error) }); return; }

  if(!data.session){
    setState({
      busy:false, screen:'authChoice',
      authError:'Signup needs "Confirm email" turned OFF in Supabase (Authentication → Settings → Email).',
    });
    return;
  }

  const { data:profile, error:pErr } = await supabase
    .from('profiles').select('*').eq('id', data.user.id).single();
  if(pErr){ setState({ busy:false, authError: friendlyError(pErr) }); return; }

  setState({ busy:false, currentUser:profile, screen:'yourCode' });
}

async function loginWithCode(){
  const code = state.authCodeInput.trim().toUpperCase();
  const password = state.authPassword;
  if(!code){ setState({ authError:'Enter your code.' }); return; }
  if(!password){ setState({ authError:'Enter your password.' }); return; }

  setState({ busy:true, authError:'' });
  const { data:email, error } = await supabase.rpc('get_email_for_code', { p_code: code });
  if(error || !email){ setState({ busy:false, authError:'No account found with that code.' }); return; }

  const { error:signInError } = await supabase.auth.signInWithPassword({ email, password });
  if(signInError){ setState({ busy:false, authError:'Wrong code or password.' }); return; }

  setState({ busy:false });
  await loadAppData();
}

function finishOnboarding(){
  setState({ screen:'app', activeTab:'today', modal:null });
  loadUserData();
}

async function logout(){ await supabase.auth.signOut(); }

/* ============================================================ */
/* Partner                                                       */
/* ============================================================ */
async function connectPartner(codeValue){
  const code = (codeValue || '').trim().toUpperCase();
  if(!code){ setState({ connectError:'Enter a code.' }); return false; }

  setState({ busy:true, connectError:'' });
  const { error } = await supabase.rpc('connect_partner', { partner_code: code });
  if(error){ setState({ busy:false, connectError: friendlyError(error) }); return false; }

  setState({ busy:false, modal:null, connectInput:'' });
  await loadUserData();
  showToast('Connected! 🫶');
  return true;
}

async function disconnectPartner(){
  setState({ busy:true });
  const { error } = await supabase.rpc('disconnect_partner');
  if(error) console.error(error);
  unsubscribeChat();
  setState({
    busy:false, partnerUser:null, partnerGoals:[],
    coupleId:null, messages:[], modal:null,
  });
  await loadUserData();
}

/* ============================================================ */
/* Push notifications                                            */
/* ============================================================ */
function pushIsSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

async function getPushRegistration(){
  if(!('serviceWorker' in navigator)) throw new Error('Service workers not supported.');
  return await navigator.serviceWorker.ready;
}

async function checkPushSubscriptionStatus(){
  if(!pushIsSupported()){ state.pushSubscribed = false; return; }
  try{
    const reg = await getPushRegistration();
    const sub = await reg.pushManager.getSubscription();
    state.pushSubscribed = Notification.permission === 'granted' && !!sub;
  }catch(e){
    console.warn('Push status check failed:', e);
    state.pushSubscribed = false;
  }
}

async function savePushSubscription(subscription){
  if(!state.currentUser) throw new Error('You must be logged in first.');
  const subJson = subscription.toJSON();
  if(!subJson?.endpoint) throw new Error('Subscription has no endpoint.');

  const { error } = await supabase.from('push_subscriptions').upsert({
    user_id: state.currentUser.id,
    endpoint: subJson.endpoint,
    subscription: subJson,
    updated_at: new Date().toISOString(),
  }, { onConflict:'endpoint' });

  if(error) throw error;
}

async function syncExistingPushSubscription(){
  if(!pushIsSupported() || !state.currentUser){ state.pushSubscribed = false; return false; }
  try{
    if(Notification.permission !== 'granted'){ state.pushSubscribed = false; return false; }
    const reg = await getPushRegistration();
    const sub = await reg.pushManager.getSubscription();
    if(!sub){ state.pushSubscribed = false; return false; }
    await savePushSubscription(sub);
    state.pushSubscribed = true;
    return true;
  }catch(e){
    console.error('Push sync failed:', e);
    state.pushSubscribed = false;
    return false;
  }
}

async function enablePushNotifications(){
  if(!state.currentUser){ showToast('Please log in first.'); return; }
  if(!pushIsSupported()){ showToast("Not supported on this browser"); return; }
  if(!window.isSecureContext){ showToast('Needs HTTPS'); return; }

  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      state.pushSubscribed = false;
      render();
      showToast('Notifications not allowed');
      return;
    }

    const reg = await getPushRegistration();
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    await savePushSubscription(sub);
    state.pushSubscribed = true;
    render();
    showToast('Notifications on 🔔');
  }catch(e){
    console.error('Push subscribe failed:', e);
    state.pushSubscribed = false;
    render();
    showToast('Could not enable notifications');
  }
}

async function disablePushNotifications(){
  if(!state.currentUser) return;
  if(!pushIsSupported()){ state.pushSubscribed = false; render(); return; }

  try{
    const reg = await getPushRegistration();
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await supabase.from('push_subscriptions')
        .delete()
        .eq('user_id', state.currentUser.id)
        .eq('endpoint', sub.endpoint);
      try{ await sub.unsubscribe(); }catch(e){ console.warn(e); }
    }
    state.pushSubscribed = false;
    render();
    showToast('Notifications off');
  }catch(e){
    console.error('Push unsubscribe failed:', e);
    state.pushSubscribed = false;
    render();
  }
}

async function addGoal(data){
  const { data:goal, error } = await supabase.from('goals').insert({
    user_id: state.currentUser.id,
    title: data.title,
    category: data.category,
    priority: data.priority,
    duration: data.duration || null,
    is_private: !!data.private,
  }).select().single();

  if(error){ showToast(friendlyError(error)); return; }
  setState({ goals:[goal, ...state.goals], modal:null });
  showToast('Goal added 🎯');
}

async function toggleGoal(id){
  const goal = state.goals.find(g => g.id === id);
  if(!goal) return;
  const nextDone = !goal.is_done;

  setState({ goals: state.goals.map(g => g.id === id ? { ...g, is_done:nextDone } : g) });

  const { error } = await supabase.from('goals')
    .update({ is_done:nextDone, completed_at: nextDone ? new Date().toISOString() : null })
    .eq('id', id);

  if(error){
    console.error(error);
    showToast(friendlyError(error));
    setState({ goals: state.goals.map(g => g.id === id ? { ...g, is_done:!nextDone } : g) });
    return;
  }
  if(nextDone) showToast('Done! ✨');
}

async function deleteGoal(id){
  const prev = state.goals;
  setState({ goals: state.goals.filter(g => g.id !== id) });
  const { error } = await supabase.from('goals').delete().eq('id', id);
  if(error){ console.error(error); setState({ goals: prev }); showToast('Could not delete'); }
}

async function postUpdate(caption, file){
  if(!caption.trim() && !file) return;

  const { data:update, error } = await supabase.from('updates').insert({
    user_id: state.currentUser.id,
    caption: caption.trim() || null,
  }).select().single();

  if(error){ console.error(error); showToast(friendlyError(error)); return; }

  if(file){
    const safeName = file.name
      .normalize('NFKD')
      .replace(/[^\w.-]+/g,'_')
      .replace(/_+/g,'_')
      .replace(/^_+|_+$/g,'')
      .slice(0,120);
    const path = `${state.currentUser.id}/updates/${update.id}/${Date.now()}-${safeName || 'photo.jpg'}`;

    const { error:uploadError } = await supabase.storage.from('photos')
      .upload(path, file, { cacheControl:'3600', upsert:false, contentType: file.type || 'image/jpeg' });

    if(uploadError){
      console.error('PHOTO UPLOAD ERROR:', uploadError);
      showToast('Photo upload failed');
      return;
    }

    const { error:dbErr } = await supabase.from('update_photos')
      .insert({ update_id: update.id, storage_path: path });
    if(dbErr){ console.error('PHOTO DB ERROR:', dbErr); }
  }

  setState({ modal:null, pendingPhotoFile:null });
  await loadUserData();
  showToast('Shared ✨');
}

async function deleteUpdate(id){
  const prev = state.updates;
  setState({ updates: state.updates.filter(u => u.id !== id) });
  const { error } = await supabase.from('updates').delete().eq('id', id);
  if(error){ console.error(error); setState({ updates: prev }); showToast('Could not delete'); }
}

async function addReaction(updateId, emoji){
  const update = state.updates.find(u => u.id === updateId);
  if(!update) return;

  const existing = (update.reactions || [])
    .find(r => r.user_id === state.currentUser.id && r.emoji === emoji);

  if(existing){
    // toggle off
    setState({
      updates: state.updates.map(u => u.id !== updateId ? u : {
        ...u, reactions: u.reactions.filter(r => r.id !== existing.id)
      })
    });
    const { error } = await supabase.from('reactions').delete().eq('id', existing.id);
    if(error){ console.error(error); await loadUserData(); }
    return;
  }

  const tempId = `temp-${Date.now()}`;
  setState({
    updates: state.updates.map(u => u.id !== updateId ? u : {
      ...u, reactions: [...(u.reactions||[]), { id:tempId, emoji, user_id: state.currentUser.id }]
    })
  });

  const { data, error } = await supabase.from('reactions')
    .insert({ update_id: updateId, user_id: state.currentUser.id, emoji })
    .select().single();

  if(error){
    if(error.code !== '23505') console.error(error);
    await loadUserData();
    return;
  }

  setState({
    updates: state.updates.map(u => u.id !== updateId ? u : {
      ...u, reactions: u.reactions.map(r => r.id === tempId ? data : r)
    })
  });
}

function cf2Sync(){
  const raw=cf2Local();
  state.cf2={...state.cf2,...raw,sharedGoals:raw.sharedGoals||[],tasks:raw.tasks||[],events:raw.events||[],lists:raw.lists||[],memories:raw.memories||[],milestones:raw.milestones||[],games:raw.games||[],achievements:raw.achievements||[],challenges:raw.challenges||[],insights:raw.insights||[]};

}
function cf2BuildSummary(days){
  const since=Date.now()-days*86400000;
  const myDone=state.goals.filter(g=>g.is_done&&new Date(g.completed_at||g.created_at).getTime()>=since).length;
  const sharedDone=state.cf2.sharedGoals.filter(g=>g.done&&new Date(g.date||0).getTime()>=since).length;
  const memories=state.cf2.memories.filter(x=>new Date(x.date||0).getTime()>=since).length;
  const messages=state.messages.filter(x=>new Date(x.created_at||0).getTime()>=since).length;
  return {myDone,sharedDone,memories,messages,xp:state.cf2.xp};
}
function cf2Award(n,reason){state.cf2.xp=Math.max(0,state.cf2.xp+n);state.cf2.level=1+Math.floor(state.cf2.xp/500);cf2Save();showToast(`${reason} +${n} XP ✨`)}

async function cf2HydrateRemote(){

  const [sg,ev,mem,mil,games,challenges,xp,pet]=await Promise.all([

  ]);
  if(sg) state.cf2.sharedGoals=sg.map(x=>({id:x.id,title:x.title,date:x.target_date||x.start_date||'',done:x.completed||false,emoji:'🎯'}));

}

}

function renderYourCode(){

/* ============================================================ */
/* Render: goal pieces                                           */
/* ============================================================ */
function renderGoalCard(g){
  const done = !!g.is_done;
  return `
    <div class="glass" style="padding:14px; display:flex; align-items:center; gap:12px; margin-bottom:10px;">
      <div class="icon-badge ${done?'done':''}">${CATEGORY_EMOJI[g.category] || '🌱'}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:14.5px; ${done?'color:var(--ink-faint); text-decoration:line-through;':''} overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(g.title)}</div>
        <div style="display:flex; gap:6px; margin-top:5px; align-items:center; flex-wrap:wrap;">
          ${g.duration ? `<span class="faint" style="font-size:11px;">⏱ ${escapeHtml(g.duration)}</span>` : ''}
          ${g.priority==='high' ? `<span class="tag pink">Priority</span>` : ''}
          ${g.is_private ? `<span class="tag blue">🔒 Private</span>` : ''}
        </div>
      </div>
      <button class="checkbox-btn ${done?'done':''}" data-action="toggle-goal" data-id="${g.id}" aria-label="Toggle goal">${done?'✓':''}</button>

}

function renderPartnerGoalRow(g){
  const done = !!g.is_done;
  return `
    <div style="display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; ${done?'color:var(--ink-faint); text-decoration:line-through;':''}">
      <span style="font-size:14px;">${CATEGORY_EMOJI[g.category] || '🌱'}</span> ${escapeHtml(g.title)}
    </div>`;
}

/* ============================================================ */
/* Render: Today                                                 */
/* ============================================================ */
function renderToday(){
  const goals = state.goals;
  const done = goals.filter(g => g.is_done).length;
  const pct = goals.length ? Math.round(done/goals.length*100) : 0;
  const partner = state.partnerUser;
  const pGoals = state.partnerGoals;
  const pPct = pGoals.length ? Math.round(pGoals.filter(g=>g.is_done).length/pGoals.length*100) : 0;

  const angle = pct/100*360;
  const ringStyle = `background: conic-gradient(var(--purple) 0deg, var(--pink) ${angle}deg, var(--glass-border) ${angle}deg 360deg);`;

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const dateLine = new Date().toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });

  return `
    <div style="padding:6px 18px 30px;">
      <div style="margin-bottom:18px;">
        <div class="muted" style="font-size:13px; font-weight:500;">${dateLine}</div>
        <h1 style="font-size:24px; font-weight:800; margin-top:2px; letter-spacing:-0.5px;">${greeting}, ${escapeHtml(state.currentUser.name)} ✨</h1>
      </div>

      <div class="glass glass-strong" style="padding:24px; margin-bottom:18px; display:flex; flex-direction:column; align-items:center;">
        <div class="muted" style="align-self:flex-start; font-size:13px; font-weight:600; margin-bottom:10px;">Today's Progress</div>
        <div style="width:168px; height:168px; border-radius:50%; ${ringStyle} display:flex; align-items:center; justify-content:center; padding:14px;">
          <div style="width:100%; height:100%; border-radius:50%; background:var(--solid); display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:36px; letter-spacing:-1px;">${pct}%</div>
            <div class="faint" style="font-size:11px; margin-top:2px;">${done} / ${goals.length} goals</div>
          </div>
        </div>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <h3 style="font-size:16px; font-weight:700;">🎯 Today's Goals</h3>
        <span class="faint" style="font-size:12px; font-weight:600;">${goals.length - done} left</span>
      </div>
      ${goals.length===0
        ? `<div class="empty-state"><div class="em">🌱</div><div class="heading" style="font-weight:700; font-size:15px;">Nothing planned yet</div><div style="font-size:13px;">Add something you want to accomplish today.</div></div>`
        : goals.map(renderGoalCard).join('')}

      <h3 style="font-size:16px; font-weight:700; margin:22px 0 10px;">🫶 Their Day</h3>
      ${!partner ? `
        <div class="glass" style="padding:20px; text-align:center;">
          <div style="font-size:26px; margin-bottom:8px;">🔗</div>
          <div style="font-weight:600; font-size:14px; margin-bottom:4px;">Not connected yet</div>
          <div class="muted" style="font-size:12.5px; margin-bottom:14px;">Share your code or enter theirs to start planning together.</div>
          <button class="btn-primary" data-action="open-connect">Connect with your partner</button>
        </div>
      ` : `
        <div class="glass" style="padding:16px;">
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
            <div class="avatar" style="width:40px; height:40px; background:linear-gradient(135deg,var(--pink),var(--purple));">${initials(partner.name)}</div>
            <div style="flex:1; min-width:0;">
              <div style="font-size:14px; font-weight:700;">${escapeHtml(partner.name)}</div>
              <div class="muted" style="font-size:12px;">${pPct}% complete</div>
            </div>
            <div style="width:46px; height:6px; border-radius:999px; background:var(--glass-border); overflow:hidden;">
              <div style="width:${pPct}%; height:100%; background:linear-gradient(90deg,var(--pink),var(--purple)); border-radius:999px;"></div>
            </div>
          </div>
          ${pGoals.length===0
            ? `<div class="faint" style="font-size:12.5px;">No shared goals visible yet.</div>`
            : pGoals.map(renderPartnerGoalRow).join('')}
        </div>
      `}
    </div>`;
}

/* ============================================================ */
/* Render: Goals                                                 */
/* ============================================================ */
function renderGoals(){
  const f = state.goalsFilter;
  const filtered = state.goals.filter(g => f==='all' ? true : f==='done' ? g.is_done : !g.is_done);
  return `
    <div style="padding:6px 18px 30px;">
      <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">🎯 Goals</h1>
      <p class="muted" style="font-size:13px; margin-bottom:16px;">Everything you're working toward</p>
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        ${['all','active','done'].map(x => `
          <button class="auth-tab ${f===x?'active':''}" style="padding:7px 16px; text-transform:capitalize;" data-action="filter-goals" data-filter="${x}">${x}</button>
        `).join('')}
      </div>
      ${filtered.length===0
        ? `<div class="empty-state"><div class="em">🌱</div><div class="heading" style="font-weight:700; font-size:15px;">Nothing here yet</div><div style="font-size:13px;">Add something you want to accomplish today.</div></div>`
        : filtered.map(renderGoalCard).join('')}
    </div>`;
}

/* ============================================================ */
/* Render: Chat                                                  */
/* ============================================================ */

  const items = [

        <button class="round-btn" data-action="toggle-chat-menu" aria-label="Menu">☰</button>

function renderChat(){

    return `

        <div class="chat-empty-content">
          <div class="empty-state">
            <div class="em">🔗</div>

            <div style="font-size:13px;margin-bottom:16px;">Once you're connected, your private chat will appear here.</div>
            <button class="btn-primary" data-action="open-connect">Connect with your partner</button>
          </div>
        </div>
      </div>`;

  return `

      ${renderChatHeader(partnerName, partnerInitial)}

        <button id="chat-send" data-action="send-chat" aria-label="Send">➤</button>
      </div>
    </div>`;
}

/* ============================================================ */
/* Render: Updates                                               */
/* ============================================================ */
function renderUpdates(){
  const list = state.updates;
  return `
    <div style="padding:6px 18px 30px;">
      <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">📸 Little moments</h1>
      <p class="muted" style="font-size:13px; margin-bottom:16px;">Small glimpses into each other's day</p>
      ${list.length===0
        ? `<div class="empty-state"><div class="em">✨</div><div class="heading" style="font-weight:700; font-size:15px;">Your day is just beginning</div><div style="font-size:13px;">Tap + to share your first moment.</div></div>`
        : list.map(u => {
          const counts = {};
          const mineSet = new Set();
          (u.reactions||[]).forEach(r => {
            counts[r.emoji] = (counts[r.emoji]||0)+1;
            if(r.user_id === state.currentUser.id) mineSet.add(r.emoji);
          });
          return `
          <div class="glass glass-strong" style="padding:16px; margin-bottom:14px;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
              <div class="avatar" style="width:34px; height:34px; font-size:13px; background:linear-gradient(135deg,${u.mine?'var(--purple),var(--pink)':'var(--pink),var(--purple)'});">${initials(u.authorName)}</div>
              <div style="flex:1; min-width:0;">
                <div style="font-size:13px; font-weight:700;">${escapeHtml(u.authorName)}</div>
                <div class="faint" style="font-size:11px;">${timeAgo(u.created_at)}</div>
              </div>
              ${u.mine ? `<button class="round-btn" style="width:28px;height:28px;font-size:12px;" data-action="delete-update" data-id="${u.id}" aria-label="Delete">✕</button>` : ''}
            </div>
            ${u.photoUrl
              ? `<img src="${u.photoUrl}" alt="" loading="lazy" style="width:100%; max-height:480px; object-fit:contain; border-radius:18px; margin-bottom:10px; background:var(--glass); display:block;" />`
              : ''}
            ${u.caption ? `<div style="font-size:14px; line-height:1.45; margin-bottom:10px; white-space:pre-wrap;">${escapeHtml(u.caption)}</div>` : ''}
            <div style="display:flex; gap:8px;">
              ${REACTION_EMOJIS.map(e => `
                <button class="glass" style="border-radius:999px; padding:5px 11px; font-size:13px; ${mineSet.has(e)?'border-color:var(--purple); background:color-mix(in srgb, var(--purple) 16%, transparent);':''}" data-action="react" data-update-id="${u.id}" data-emoji="${e}">
                  ${e}${counts[e] ? ` ${counts[e]}` : ''}
                </button>`).join('')}
            </div>
          </div>`;
        }).join('')}
    </div>`;
}

/* ============================================================ */
/* Render: Progress                                              */
/* ============================================================ */
function renderProgress(){
  const goals = state.goals;
  const done = goals.filter(g => g.is_done).length;
  const pct = goals.length ? Math.round(done/goals.length*100) : 0;
  const byCat = {};
  goals.forEach(g => {
    byCat[g.category] = byCat[g.category] || { total:0, done:0 };
    byCat[g.category].total++;
    if(g.is_done) byCat[g.category].done++;
  });

  return `
    <div style="padding:6px 18px 30px;">
      <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">📊 Your progress</h1>
      <p class="muted" style="font-size:13px; margin-bottom:16px;">Based on the goals you've added</p>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
        <div class="glass" style="padding:16px;">
          <div class="muted" style="font-size:12px; font-weight:600; margin-bottom:6px;">Completion</div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:26px;">${pct}%</div>
        </div>
        <div class="glass" style="padding:16px;">
          <div class="muted" style="font-size:12px; font-weight:600; margin-bottom:6px;">Goals done</div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:26px;">${done}</div>
        </div>
      </div>

      <h3 style="font-size:14px; font-weight:700; margin-bottom:10px;">By category</h3>
      ${Object.keys(byCat).length===0
        ? `<div class="empty-state"><div class="em">📊</div><div style="font-size:13px;">Add goals to see your breakdown here.</div></div>`
        : Object.entries(byCat).map(([cat,v]) => {
            const p = v.total ? Math.round(v.done/v.total*100) : 0;
            return `
              <div class="glass" style="padding:14px; margin-bottom:8px; display:flex; align-items:center; gap:12px;">
                <div class="icon-badge done">${CATEGORY_EMOJI[cat] || '🌱'}</div>
                <div style="flex:1; min-width:0;">
                  <div style="font-size:13px; font-weight:600; margin-bottom:4px;">${CATEGORY_LABEL[cat] || cat}</div>
                  <div style="width:100%; height:5px; border-radius:999px; background:var(--glass-border);">
                    <div style="width:${p}%; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--purple),var(--pink));"></div>
                  </div>
                </div>
                <div class="muted" style="font-size:12px; font-weight:700;">${v.done}/${v.total}</div>
              </div>`;
          }).join('')}
    </div>`;
}

/* ============================================================ */
/* Render: Together                                              */
/* ============================================================ */
function renderTogether(){
  const goals = state.goals, pGoals = state.partnerGoals;
  const myPct = goals.length ? Math.round(goals.filter(g=>g.is_done).length/goals.length*100) : 0;
  const pPct = pGoals.length ? Math.round(pGoals.filter(g=>g.is_done).length/pGoals.length*100) : 0;
  const together = state.partnerUser ? Math.round((myPct+pPct)/2) : myPct;

  return `
    <div style="padding:6px 18px 30px;">
      <h1 style="font-size:22px; font-weight:800; margin-bottom:4px;">🫶 Together</h1>
      <p class="muted" style="font-size:13px; margin-bottom:16px;">${state.partnerUser ? 'You and '+escapeHtml(state.partnerUser.name) : 'Connect with your partner to see this fill in'}</p>
      <button class="btn-primary cf2-pop" style="margin-bottom:14px;" data-action="open-cf2">✨ Open CoupleFlow Hub</button>

      <div class="glass glass-strong" style="padding:22px; margin-bottom:16px;">
        <div style="display:flex; justify-content:space-around; margin-bottom:16px;">
          <div style="text-align:center;">
            <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px; color:var(--purple-deep);">${myPct}%</div>
            <div class="muted" style="font-size:11px; margin-top:2px;">You</div>
          </div>
          <div style="text-align:center;">
            <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px;">${together}%</div>
            <div class="muted" style="font-size:11px; margin-top:2px;">Together</div>
          </div>
          <div style="text-align:center;">
            <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px; color:var(--pink-deep);">${pPct}%</div>
            <div class="muted" style="font-size:11px; margin-top:2px;">${state.partnerUser ? escapeHtml(state.partnerUser.name) : 'Partner'}</div>
          </div>
        </div>
        <div style="text-align:center; font-size:13.5px; font-weight:500; padding:12px 8px; border-radius:16px; background:linear-gradient(135deg,color-mix(in srgb, var(--purple) 12%, transparent),color-mix(in srgb, var(--pink) 12%, transparent));">
          ${!state.partnerUser ? 'Connect to start building your week together ✨'
            : together>=70 ? 'You both had a great week ✨' : 'Every bit of progress counts 🌱'}
        </div>
      </div>

      ${!state.partnerUser ? `<button class="btn-primary" data-action="open-connect">Connect with your partner</button>` : ''}
    </div>`;
}

/* Render: Modals                                                */
/* ============================================================ */

    <div style="display:flex; align-items:center; gap:10px; margin:2px 0 18px;">
      ${backAction ? `<button class="round-btn" style="font-size:18px;" data-action="${backAction}" aria-label="Back">←</button>` : ''}
      <h2 style="font-size:17px; font-weight:700; margin:0; flex:1;">${title}</h2>
      <button class="round-btn" data-action="close-modal-btn" aria-label="Close">✕</button>
    </div>`;
}

  const notificationsReady = pushIsSupported() && window.isSecureContext;

  if(state.modal === 'settings') return `
    <div class="modal-overlay" data-action="close-modal">
      <div class="modal-sheet">
        <div class="drag-handle"></div>
        ${modalHeader('⚙️ Settings', null)}

        <div class="glass" style="padding:16px; margin-bottom:12px;">
          <div class="muted" style="font-size:11.5px; margin-bottom:4px;">Your name</div>
          <div style="font-weight:600; font-size:14px; margin-bottom:12px;">${escapeHtml(state.currentUser.name)}</div>
          <div class="muted" style="font-size:11.5px; margin-bottom:4px;">Your code</div>
          <div style="display:flex; align-items:center; gap:10px;">

            <button class="round-btn" data-action="copy-code" aria-label="Copy code">📋</button>
          </div>
        </div>

        <div class="glass" style="padding:16px; margin-bottom:12px;">
          <div class="muted" style="font-size:11.5px; margin-bottom:8px;">Partner</div>
          ${state.partnerUser ? `
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
              <span style="font-weight:600; font-size:14px;">${escapeHtml(state.partnerUser.name)}</span>
              <button class="tag pink" style="border:none;" data-action="disconnect-partner">Disconnect</button>
            </div>
          ` : `<button class="btn-secondary" data-action="open-connect">Connect with your partner</button>`}
        </div>

        <button class="btn-secondary" style="margin-bottom:10px;" data-action="toggle-theme">
          ${state.theme==='dark' ? '☀️ Light mode' : '🌙 Dark mode'}
        </button>

        <button class="btn-secondary" style="margin-bottom:10px;"
          data-action="${notificationsReady ? (state.pushSubscribed ? 'disable-notifications' : 'enable-notifications') : 'show-notification-help'}">
          ${notificationsReady
            ? (state.pushSubscribed ? '🔕 Turn off notifications' : '🔔 Enable notifications')
            : '🔔 Notifications need HTTPS'}
        </button>

        <button class="btn-secondary" data-action="do-logout">🚪 Log out</button>
      </div>

  if(state.modal === 'addChoice') return `

        <div class="drag-handle"></div>
        ${modalHeader('What would you like to do?', null)}
        <button class="btn-secondary" style="margin-bottom:10px; text-align:left; padding:14px 16px;" data-action="open-add-goal">🎯 &nbsp; Add a goal</button>
        <button class="btn-secondary" style="text-align:left; padding:14px 16px;" data-action="open-add-update">📸 &nbsp; Share a moment</button>
      </div>
    </div>`;

  if(state.modal === 'addGoal') return `

          <button class="cf2-card" data-action="cf2-milestone"><div class="cf2-icon">🏆</div><div class="cf2-title">Milestone</div><div class="cf2-sub">Mark something meaningful.</div></button>

  if(state.modal === 'cf2-form') return `

        ${state.connectError ? `<div class="error-text">${escapeHtml(state.connectError)}</div>` : ''}
        <button class="btn-primary" data-action="submit-connect" ${state.busy?'disabled':''}>${state.busy?'Connecting…':'Connect now'}</button>

  return '';
}

/* ============================================================ */
/* Master render                                                 */
/* ============================================================ */
function render(){
  const root = document.getElementById('screen');
  const app = document.getElementById('app');
  const theme = state.theme === 'dark' ? 'dark' : 'light';
  app.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-theme', theme);

  let body = '';
  if(state.screen === 'loading') body = renderLoading();
  else if(state.screen === 'authChoice') body = renderAuthChoice();
  else if(state.screen === 'create') body = renderCreateForm();
  else if(state.screen === 'login') body = renderLoginForm();
  else if(state.screen === 'yourCode') body = renderYourCode();
  else if(state.screen === 'app'){
    const screens = {
      today:renderToday, goals:renderGoals, chat:renderChat,
      updates:renderUpdates, progress:renderProgress, together:renderTogether,
    };
    body = (screens[state.activeTab] || renderToday)();
  }

  const isChat = state.screen === 'app' && state.activeTab === 'chat';
  const showChrome = state.screen === 'app' && !isChat;

  root.innerHTML = `
    ${showChrome ? renderTopbar() : ''}
    ${body}
    ${showChrome ? renderBottomNav() : ''}
    ${renderModal()}
    ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
  `;

  app.classList.toggle('chat-mode', isChat);

  bindInputs();

  if(isChat){
    const list = document.getElementById('chat-list');
    if(list){
      list.scrollTop = list.scrollHeight;
      lastRenderedMessageCount = state.messages.length;
    }
    const chatInput = document.getElementById('chat-input');
    if(chatInput){
      chatInput.addEventListener('input', () => {
        notifyTyping();
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + 'px';
      });
      chatInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault();
          sendChatMessage();
        }
      });
      chatInput.addEventListener('focus', () => {
        scrollChatToBottom();
        setTimeout(scrollChatToBottom, 120);
        setTimeout(scrollChatToBottom, 320);
      });
    }
    watchChatViewport();
  }
}

/* ============================================================ */
/* Input bindings                                                */
/* ============================================================ */
function bindInputs(){
  const bind = (id, key, transform) => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', e => {
      state[key] = transform ? transform(e.target.value) : e.target.value;
    });
  };
  bind('name-input','authName');
  bind('password-input','authPassword');
  bind('login-code-input','authCodeInput');
  bind('connect-now-input','connectInput');
  bind('connect-input','connectInput');

  const photoInput = document.getElementById('update-photo-input');
  if(photoInput) photoInput.addEventListener('change', e => {
    const file = e.target.files[0] || null;
    if(file && file.size > 10 * 1024 * 1024){
      showToast('Photo too large (max 10MB)');
      return;
    }
    state.pendingPhotoFile = file;
    render();
  });
}

async function copyCode(){
  const code = state.currentUser?.code || '';
  try{
    await navigator.clipboard.writeText(code);
    showToast('Code copied!');
  }catch(_){
    const ta = document.createElement('textarea');
    ta.value = code;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); showToast('Code copied!'); }
    catch(e){ showToast('Your code: ' + code); }
    ta.remove();
  }
}

/* ============================================================ */
/* Events                                                        */
/* ============================================================ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');

  // tapping outside the chat menu closes it
  if(state.chatMenuOpen && !e.target.closest('.chat-menu-wrap')){
    setState({ chatMenuOpen:false });
    return;
  }

  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action === 'close-modal'){
    if(e.target !== el) return;
    history.back();
    return;
  }
  if(action === 'close-modal-btn'){ history.back(); return; }

  if(action === 'toggle-theme'){
    const next = state.theme === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem('coupleflow-theme', next); }catch(_){}
    setState({ theme: next, chatMenuOpen:false });
    return;
  }

  if(action === 'goto-create'){ setState({ screen:'create', authError:'' }); return; }
  if(action === 'goto-login'){ setState({ screen:'login', authError:'' }); return; }
  if(action === 'goto-choice'){ setState({ screen:'authChoice', authError:'' }); return; }
  if(action === 'submit-create'){ createAccount(); return; }
  if(action === 'submit-login'){ loginWithCode(); return; }
  if(action === 'copy-code'){ copyCode(); return; }

  if(action === 'open-add'){ setState({ modal:'addChoice' }); return; }

  if(action === 'open-cf2'){ cf2Sync(); setState({modal:'cf2'}); return; }
  if(action === 'cf2-question'){cf2OpenType('question','💭 Daily Question');return;}
  if(action === 'cf2-mood'){cf2OpenType('mood','🌤️ Mood Check-in');return;}
  if(action === 'cf2-appreciation'){cf2OpenType('appreciation','💌 Appreciation');return;}
  if(action === 'cf2-thinking'){state.cf2.thinking=true;cf2Award(10,'Thinking of You');cf2Save();setState({modal:null});showToast('Thinking of you sent 🫶');return;}
  if(action === 'cf2-shared-goal'){cf2OpenType('shared-goal','🎯 Shared Goal');return;}  if(action === 'cf2-smart'){cf2OpenType('smart','🪄 Smart Goal Planner');return;}
  if(action === 'cf2-streak'){cf2OpenType('streak','🔥 Goal Streaks');return;}
  if(action === 'cf2-submit-smart'){const goal=document.getElementById('cf2-smart-goal')?.value.trim();const days=Math.max(2,Math.min(30,Number(document.getElementById('cf2-smart-days')?.value||7)));if(!goal){showToast('Enter a goal first');return;}const steps=['Define the exact outcome','Choose the smallest first action','Work on it for 20–30 minutes','Review what worked','Finish or adjust the next step'];state.cf2.tasks=steps.slice(0,Math.min(steps.length,days)).map((x,i)=>({title:x+' — '+goal,sub:'Day '+(i+1),done:false,emoji:'✅'}));cf2Save();cf2Award(25,'Plan created');cf2OpenType('smart','🪄 Smart Goal Planner');return;}

  if(action === 'cf2-calendar'){cf2OpenType('calendar','🗓️ Shared Plans');return;}
  if(action === 'cf2-list'){cf2OpenType('list','📝 Shared Lists');return;}
  if(action === 'cf2-memory'){cf2OpenType('memory','📸 Memory Timeline');return;}
  if(action === 'cf2-milestone'){cf2OpenType('milestone','🏆 Milestones');return;}
  if(action === 'cf2-game'){cf2OpenType('game','🎮 Couple Games');return;}
  if(action === 'cf2-challenge'){cf2OpenType('challenge','🔥 Shared Challenge');return;}
  if(action === 'cf2-pet'){cf2OpenType('pet','🐰 Virtual Pet');return;}
  if(action === 'cf2-summary'){cf2OpenType('summary','📊 Weekly Summary');return;}
  if(action === 'cf2-wrapped'){cf2OpenType('wrapped','✨ Couple Wrapped');return;}
  if(action === 'cf2-insights'){cf2OpenType('insights','🧠 CoupleFlow Insights');return;}
  if(action === 'cf2-xp'){cf2OpenType('xp','⭐ XP & Achievements');return;}
  if(action === 'cf2-set-mood'){state.cf2.mood=el.getAttribute('data-mood');cf2Award(10,'Mood check-in');cf2Save();setState({modal:null});showToast('Mood saved 🌤️');return;}
  if(action === 'cf2-submit-question'){const v=document.getElementById('cf2-answer')?.value.trim();if(!v){showToast('Write an answer first');return;}state.cf2.answer=v;cf2Award(20,'Question answered');cf2Save();setState({modal:null});showToast('Answer saved 💭');return;}
  if(action === 'cf2-submit-appreciation'){const v=document.getElementById('cf2-appreciation')?.value.trim();if(!v){showToast('Write something first');return;}state.cf2.appreciation=v;cf2Award(20,'Appreciation');cf2Save();setState({modal:null});showToast('Appreciation saved 💌');return;}
  if(action === 'cf2-submit-shared-goal'){const v=document.getElementById('cf2-shared-title')?.value.trim();if(!v){showToast('Name the shared goal');return;}state.cf2.sharedGoals.unshift({title:v,date:document.getElementById('cf2-shared-date')?.value||'',done:false,emoji:'🎯'});cf2Achievement('first-shared-goal','First shared goal','🎯');cf2Save();cf2Award(30,'Shared goal');cf2Reopen('shared-goal','🎯 Shared Goal');return;}
  if(action === 'cf2-submit-event'){const v=document.getElementById('cf2-event-title')?.value.trim();if(!v){showToast('Name the plan');return;}state.cf2.events.unshift({title:v,date:document.getElementById('cf2-event-date')?.value||'',sub:document.getElementById('cf2-event-location')?.value||'',done:false,emoji:'🗓️'});cf2Award(15,'Shared plan');cf2Save();cf2Reopen('calendar','🗓️ Shared Plans');return;}
  if(action === 'cf2-submit-list'){const v=document.getElementById('cf2-list-title')?.value.trim();if(!v){showToast('Add an item');return;}state.cf2.lists.unshift({title:v,sub:document.getElementById('cf2-list-name')?.value||'Shared List',done:false,emoji:'📝'});cf2Award(10,'Shared list');cf2Save();cf2Reopen('list','📝 Shared Lists');return;}
  if(action === 'cf2-submit-memory'){const v=document.getElementById('cf2-memory-title')?.value.trim();if(!v){showToast('Name the memory');return;}state.cf2.memories.unshift({title:v,date:document.getElementById('cf2-memory-date')?.value||new Date().toISOString().slice(0,10),sub:document.getElementById('cf2-memory-note')?.value||'',done:false,emoji:'📸'});cf2Achievement('first-memory','First memory','📸');cf2Award(20,'Memory');cf2Save();cf2Reopen('memory','📸 Memory Timeline');return;}
  if(action === 'cf2-submit-milestone'){const v=document.getElementById('cf2-milestone-title')?.value.trim();if(!v){showToast('Name the milestone');return;}state.cf2.milestones.unshift({title:v,date:document.getElementById('cf2-milestone-date')?.value||'',done:false,emoji:'🏆'});cf2Award(25,'Milestone');cf2Save();cf2Reopen('milestone','🏆 Milestones');return;}
  if(action === 'cf2-game-start'){const game=el.getAttribute('data-game');const titles={trivia:'Quick Trivia',choice:'This or That',guess:'Guess My Answer'};state.cf2.games.unshift({title:titles[game]||'Couple Game',sub:'Started '+new Date().toLocaleDateString(),done:false,emoji:'🎮'});cf2Award(15,'Game started');cf2Save();showToast('Game started 🎮');cf2Reopen('game','🎮 Couple Games');return;}
  if(action === 'cf2-submit-challenge'){const v=document.getElementById('cf2-challenge-title')?.value.trim();if(!v){showToast('Name the challenge');return;}state.cf2.challenges.unshift({title:v,sub:(document.getElementById('cf2-challenge-xp')?.value||50)+' XP',done:false,emoji:'🔥'});cf2Save();cf2Reopen('challenge','🔥 Shared Challenge');return;}
  if(action === 'cf2-pet-feed'){state.cf2.pet.xp+=20;state.cf2.pet.happiness=Math.min(100,state.cf2.pet.happiness+5);state.cf2.pet.energy=Math.min(100,state.cf2.pet.energy+3);cf2Award(10,'Pet care');cf2Save();showToast('Mochi is happy 🐰');return;}
  if(action === 'cf2-done'){cf2HandleDone(Number(el.getAttribute('data-index')));return;}

  if(action === 'open-add-goal'){ setState({ modal:'addGoal' }); return; }
  if(action === 'open-add-update'){ setState({ modal:'addUpdate', pendingPhotoFile:null }); return; }
  if(action === 'back-add-choice'){ setState({ modal:'addChoice' }); return; }

  if(action === 'tab'){ setState({ activeTab: el.getAttribute('data-tab'), chatMenuOpen:false }); return; }
  if(action === 'toggle-chat-menu'){ setState({ chatMenuOpen: !state.chatMenuOpen }); return; }
  if(action === 'chat-back-home'){ setState({ activeTab:'today', chatMenuOpen:false }); return; }
  if(action === 'chat-menu-select'){ setState({ activeTab: el.getAttribute('data-tab'), chatMenuOpen:false }); return; }

  if(action === 'open-connect'){ setState({ modal:'connect', connectError:'' }); return; }
  if(action === 'open-settings'){
    await checkPushSubscriptionStatus();
    setState({ modal:'settings' });
    return;
  }
  if(action === 'show-notification-help'){ showToast('Notifications need HTTPS or localhost'); return; }
  if(action === 'enable-notifications'){ enablePushNotifications(); return; }
  if(action === 'disable-notifications'){ disablePushNotifications(); return; }

  if(action === 'do-logout'){ logout(); return; }
  if(action === 'disconnect-partner'){ disconnectPartner(); return; }
  if(action === 'filter-goals'){ setState({ goalsFilter: el.getAttribute('data-filter') }); return; }
  if(action === 'toggle-goal'){ toggleGoal(el.getAttribute('data-id')); return; }
  if(action === 'delete-goal'){ deleteGoal(el.getAttribute('data-id')); return; }
  if(action === 'delete-update'){ deleteUpdate(el.getAttribute('data-id')); return; }
  if(action === 'react'){
    addReaction(el.getAttribute('data-update-id'), el.getAttribute('data-emoji'));
    return;
  }
  if(action === 'send-chat'){ sendChatMessage(); return; }

  if(action === 'connect-now'){
    const ok = await connectPartner(state.connectInput);
    if(ok) finishOnboarding();
    return;
  }
  if(action === 'skip-connect'){
    state.connectInput = ''; state.connectError = '';
    finishOnboarding();
    return;
  }
  if(action === 'submit-connect'){
    const val = state.connectInput || document.getElementById('connect-input')?.value || '';
    await connectPartner(val);
    return;
  }

  if(action === 'submit-goal'){
    const titleEl = document.getElementById('goal-title');
    const title = titleEl?.value.trim();
    if(!title){ titleEl?.focus(); showToast('Give your goal a name'); return; }
    addGoal({
      title,
      category: document.getElementById('goal-category')?.value,
      duration: document.getElementById('goal-duration')?.value.trim(),
      priority: document.getElementById('goal-priority')?.value,
      private: document.getElementById('goal-private')?.checked || false,
    });
    return;
  }

  if(action === 'submit-update'){
    const caption = document.getElementById('update-caption')?.value || '';
    if(!caption.trim() && !state.pendingPhotoFile){ showToast('Add a photo or a caption'); return; }
    state.busy = true; render();
    await postUpdate(caption, state.pendingPhotoFile);
    state.busy = false; render();
    return;
  }
});

// Enter to submit on auth screens
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Enter') return;
  if(state.screen === 'create') createAccount();
  else if(state.screen === 'login') loginWithCode();
});

/* ============================================================ */
/* Init                                                          */
/* ============================================================ */
render();
restoreSession();

})();
